name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace:
          - apps/api
          - apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm -w ${{ matrix.workspace }} run lint --if-present

      - name: Typecheck
        run: npm -w ${{ matrix.workspace }} run typecheck --if-present
        
      - name: Build
        run: npm -w ${{ matrix.workspace }} run build --if-present

      - name: Unit tests
        run: npm -w ${{ matrix.workspace }} test --if-present
