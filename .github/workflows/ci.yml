name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -F @vault/db -F @vault/types run build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/db/dist
            packages/types/dist
          retention-days: 1

  ci:
    name: ${{ matrix.workspace }}
    needs: build-packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace:
          - apps/api
          - apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore shared package builds
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Lint
        run: pnpm -F ${{ matrix.workspace }} run lint --if-present

      - name: Typecheck
        run: pnpm -F ${{ matrix.workspace }} run typecheck --if-present

      - name: Build
        run: pnpm -F ${{ matrix.workspace }} run build --if-present

      - name: Test
        run: pnpm -F ${{ matrix.workspace }} run test --if-present
