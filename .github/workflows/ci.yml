name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build shared packages
        run: npm run build --workspace=packages/db --workspace=packages/types

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/db/dist
            packages/types/dist
          retention-days: 1

  ci:
    name: ${{ matrix.workspace }}
    needs: build-packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace:
          - apps/api
          - apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Restore shared package builds
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Install lightningcss Linux binary
        run: |
          VERSION=$(node -p "require('./node_modules/lightningcss/package.json').optionalDependencies['lightningcss-linux-x64-gnu']")
          npm install --no-save lightningcss-linux-x64-gnu@$VERSION

      - name: Lint
        run: npm -w ${{ matrix.workspace }} run lint --if-present

      - name: Typecheck
        run: npm -w ${{ matrix.workspace }} run typecheck --if-present

      - name: Build
        run: npm -w ${{ matrix.workspace }} run build --if-present

      - name: Test
        run: npm -w ${{ matrix.workspace }} run test --if-present
