services:
  postgres:
    image: postgres:16
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=10
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c synchronous_commit=off
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vault
      MINIO_ROOT_PASSWORD: vaultvault
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data

  jobs:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: jobs
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  pgdata:
  minio:
