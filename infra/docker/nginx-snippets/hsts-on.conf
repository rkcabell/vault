# Mount this instead of hsts-off.conf once a CA-trusted cert (Let's Encrypt,
# or terminated upstream by Tailscale/Caddy/an LB) is in place. See
# docs/security/TLS.md before switching — reverting is not instant, browsers
# that already saw the header keep enforcing HTTPS-only for max-age seconds.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
