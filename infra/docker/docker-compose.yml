services:
  postgres:
    image: postgres:16
    env_file: ../../.env.docker
    # Raise headroom above the default 100. Dev runs multiple Prisma clients (API
    # + worker, plus any zombie node processes from restarts); a burst of indexing
    # jobs + a bulk delete can otherwise hit "too many clients already" (P2037).
    command: [ "postgres", "-c", "max_connections=200" ]
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.docker}
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d vault" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: ../../.env.docker
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env.docker}
    ports: [ "9000:9000", "9001:9001" ]
    volumes:
      - minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: ../../.env.docker
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${S3_BUCKET:-vault-media};
        echo 'MinIO bucket ready';
      "

  db-migrate:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    command: sh -c "pnpm -F @vault/db exec prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8000"
    ports: [ "8000:8000" ]
    restart: on-failure

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        API_BASE_URL: http://api:8000
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    ports: [ "3000:3000" ]

  jobs-ocr:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: jobs
    command: pnpm -F api run worker:ocr
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2g

  jobs-thumb:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: jobs
    command: pnpm -F api run worker:thumb
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  minio:
  pgdata:
