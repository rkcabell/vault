services:
  postgres:
    image: postgres:16
    env_file: ../../.env.docker
    # Raise headroom above the default 100. Dev runs multiple Prisma clients (API
    # + worker, plus any zombie node processes from restarts); a burst of indexing
    # jobs + a bulk delete can otherwise hit "too many clients already" (P2037).
    command: [ "postgres", "-c", "max_connections=200" ]
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.docker}
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d vault" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    command: sh -c "pnpm -F @vault/db exec prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8000"
      STORAGE_FS_PATH: /data/vault
    ports: [ "8000:8000" ]
    volumes:
      - vault-data:/data/vault
    restart: on-failure

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        API_BASE_URL: http://api:8000
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    ports: [ "3000:3000" ]

  # Tier 1: native pdf.js / plain-text reads. Cheap, high concurrency, and
  # deliberately its own container so a scanned-PDF backlog on jobs-ocr cannot
  # stop a born-digital library from becoming searchable.
  jobs-text:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: jobs
    command: pnpm -F api run worker:text
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1g

  # Tier 2: ocrmypdf/Tesseract. One subprocess per concurrency slot, each
  # costing roughly a core and up to a gigabyte — scale by replicas, not by
  # raising OCR_CONCURRENCY.
  jobs-ocr:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: jobs
    command: pnpm -F api run worker:ocr
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2g

  jobs-thumb:
    env_file: ../../.env.docker
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: jobs
    command: pnpm -F api run worker:thumb
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  vault-data:
  pgdata:
