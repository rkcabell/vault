services:
  postgres:
    image: postgres:16
    env_file: ../../.env.prod
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d vault" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      target: api
    env_file: ../../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:8000/health/healthz').then(r=>process.exit(r.ok?0:1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      target: web
    env_file: ../../.env.prod
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:alpine
    volumes:
      - ../../infra/docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cache:/var/cache/nginx/thumbs
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

  # Tier 1: native pdf.js / plain-text reads. Cheap, high concurrency, and
  # deliberately its own container so a scanned-PDF backlog on jobs-ocr cannot
  # stop a born-digital library from becoming searchable.
  jobs-text:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      target: jobs
    command: [ "node", "apps/api/dist/worker/text.js" ]
    env_file: ../../.env.prod
    environment:
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # Tier 2: ocrmypdf/Tesseract. One subprocess per concurrency slot, each
  # costing roughly a core and up to a gigabyte — scale by replicas, not by
  # raising OCR_CONCURRENCY.
  jobs-ocr:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      target: jobs
    command: [ "node", "apps/api/dist/worker/ocr.js" ]
    env_file: ../../.env.prod
    environment:
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  jobs-thumb:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      target: jobs
    command: [ "node", "apps/api/dist/worker/thumb.js" ]
    env_file: ../../.env.prod
    environment:
      STORAGE_FS_PATH: /data/vault
    volumes:
      - vault-data:/data/vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  pgdata:
  vault-data:
  nginx-cache:
