proxy_cache_path /var/cache/nginx/thumbs
  levels=1:2
  keys_zone=thumbs:10m
  max_size=2g
  inactive=365d
  use_temp_path=off;

server {
  listen 80;

  # Use Docker's embedded DNS so nginx resolves upstreams per-request rather
  # than at startup. Without this, nginx crashes if "web" isn't available when
  # it starts (e.g. after web is recreated). valid=5s re-queries DNS regularly.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Cache immutable thumbnails. They are served with Cache-Control: immutable
  # and never change once generated, so a 365-day server-side TTL is safe.
  location ~ ^/api/.+/thumbnail$ {
    proxy_cache           thumbs;
    proxy_cache_valid     200 365d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock      on;
    add_header            X-Cache-Status $upstream_cache_status;
    set $web_upstream     http://web:3000;
    proxy_pass            $web_upstream;
    proxy_set_header      Host $host;
    proxy_set_header      X-Real-IP $remote_addr;
    proxy_set_header      Cookie $http_cookie;
  }

  # Everything else passes through uncached.
  location / {
    set $web_upstream   http://web:3000;
    proxy_pass          $web_upstream;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    Cookie $http_cookie;
  }
}
