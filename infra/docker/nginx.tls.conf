proxy_cache_path /var/cache/nginx/thumbs
  levels=1:2
  keys_zone=thumbs:10m
  max_size=2g
  inactive=365d
  use_temp_path=off;

# Plain HTTP: redirect everything to HTTPS except /health/*, which must keep
# answering here for container/LB probes that never see a cert. /health/*
# reaches the API through Next.js (web:3000), not nginx -> api directly.
server {
  listen 80;

  resolver 127.0.0.11 valid=5s ipv6=off;

  location /health/ {
    set $web_upstream http://web:3000;
    proxy_pass         $web_upstream;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $remote_addr;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;

  # Cert files are bind-mounted in; see docker-compose.tls.yml and
  # docs/security/TLS.md. Missing files stop nginx from starting, which is
  # why this config is opt-in via a compose override, not the default.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:tls_sessions:10m;
  ssl_session_timeout 1d;

  # Empty by default (hsts-off.conf) — see docs/security/TLS.md before
  # switching to hsts-on.conf. A self-signed cert must never get this header.
  include /etc/nginx/snippets/hsts.conf;

  resolver 127.0.0.11 valid=5s ipv6=off;

  location ~ ^/api/.+/thumbnail$ {
    proxy_cache           thumbs;
    proxy_cache_valid     200 365d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock      on;
    add_header            X-Cache-Status $upstream_cache_status;
    set $web_upstream     http://web:3000;
    proxy_pass            $web_upstream;
    proxy_set_header      Host $host;
    proxy_set_header      X-Real-IP $remote_addr;
    # X-Forwarded-For rationale (overwrite, not append): see nginx.prod.conf.
    proxy_set_header      X-Forwarded-For $remote_addr;
    proxy_set_header      Cookie $http_cookie;
  }

  # Whole-file request bodies — rationale in nginx.prod.conf.
  location ^~ /api/ingest/ {
    client_max_body_size    2g;
    proxy_request_buffering off;
    set $web_upstream       http://web:3000;
    proxy_pass               $web_upstream;
    proxy_set_header         Host $host;
    proxy_set_header         X-Real-IP $remote_addr;
    proxy_set_header         X-Forwarded-For $remote_addr;
    proxy_set_header         Cookie $http_cookie;
  }

  location ^~ /api/storage/blob/ {
    client_max_body_size    2g;
    proxy_request_buffering off;
    set $web_upstream       http://web:3000;
    proxy_pass               $web_upstream;
    proxy_set_header         Host $host;
    proxy_set_header         X-Real-IP $remote_addr;
    proxy_set_header         X-Forwarded-For $remote_addr;
    proxy_set_header         Cookie $http_cookie;
  }

  # Everything else passes through uncached.
  location / {
    set $web_upstream   http://web:3000;
    proxy_pass          $web_upstream;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $remote_addr;
    proxy_set_header    Cookie $http_cookie;
  }
}
