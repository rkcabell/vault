components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    ErrorResponse:
      type: object
      description: Error response payloads from Fastify and rate limiting.
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        limit:
          type: integer
        windowMs:
          type: integer
    User:
      type: object
      description: User summary returned by auth endpoints.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
      required:
        - id
        - email
    AuthRegisterRequest:
      type: object
      description: Registration credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthRegisterResponse:
      type: object
      description: User and tokens returned after registration.
      properties:
        user:
          $ref: "#/components/schemas/User"
        access:
          type: string
        refresh:
          type: string
      required:
        - user
        - access
        - refresh
    AuthLoginRequest:
      type: object
      description: Login credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthLoginResponse:
      type: object
      description: User returned after login.
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    AuthRefreshRequest:
      type: object
      description: Refresh token payload.
      properties:
        refresh:
          type: string
      required:
        - refresh
    AuthRefreshResponse:
      type: object
      description: New access token payload.
      properties:
        access:
          type: string
      required:
        - access
    AuthMeResponse:
      type: object
      description: Current user response.
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    Profile:
      type: object
      description: Profile details for the current user.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        website:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - username
        - bio
        - website
        - location
        - avatarUrl
        - createdAt
    ProfileResponse:
      type: object
      description: Profile response envelope.
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - profile
    ProfilePatchRequest:
      type: object
      description: Profile fields to update (all optional).
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        website:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
    MediaWorkerState:
      type: string
      description: Background processing state for media.
      enum:
        - PENDING
        - READY
        - ERROR
        - FAILED
    MediaSortOption:
      type: string
      description: Sort options for media listing.
      enum:
        - createdAt_desc
        - createdAt_asc
        - title_asc
        - title_desc
        - size_desc
        - size_asc
        - mimeType_asc
    TextSource:
      type: string
      description: Source of extracted text.
      enum:
        - OCR
        - NATIVE
        - UNKNOWN
    TextLanguageStatus:
      type: string
      description: Language detection status.
      enum:
        - ok
        - short
        - error
    TagInput:
      description: Tag list as a comma-separated string or array of strings.
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    MediaInitUploadRequest:
      type: object
      description: Request to initialize an upload and receive a presigned URL.
      properties:
        filename:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 1
          description: Upload size limit is 50 MB for photos, 250 MB for documents, with a hard cap of 500 MB for other files.
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      required:
        - filename
        - mimeType
        - sizeBytes
        - title
    MediaInitUploadResponse:
      type: object
      description: Upload initialization response.
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
        storageKey:
          type: string
      required:
        - id
        - uploadUrl
        - storageKey
    MediaBatchInitRequestItem:
      type: object
      description: Single item for batch upload initialization.
      properties:
        filename:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 1
          description: Upload size limit is 50 MB for photos, 250 MB for documents, with a hard cap of 500 MB for other files.
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      required:
        - filename
        - mimeType
        - sizeBytes
    MediaBatchInitRequest:
      type: object
      description: Batch upload initialization request.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MediaBatchInitRequestItem"
      required:
        - items
    MediaBatchInitResponseItem:
      type: object
      description: Batch upload initialization result for one item.
      properties:
        id:
          type: string
          format: uuid
        storageKey:
          type: string
        putUrl:
          type: string
      required:
        - id
        - storageKey
        - putUrl
    MediaBatchInitResponse:
      type: object
      description: Batch upload initialization response.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaBatchInitResponseItem"
      required:
        - items
    MediaBatchFinalizeRequest:
      type: object
      description: Finalize multiple uploads after data is uploaded.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
      required:
        - ids
    MediaFinalizeResponse:
      type: object
      description: Finalize result with updated count.
      properties:
        ok:
          type: boolean
        count:
          type: integer
      required:
        - ok
        - count
    MediaSummary:
      type: object
      description: Summary item returned by media list.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        mimeType:
          type: string
      required:
        - id
        - title
        - thumbState
        - textState
        - createdAt
        - tags
        - mimeType
    MediaListResponse:
      type: object
      description: Paginated media list response.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaSummary"
        nextCursor:
          type:
            - string
            - "null"
        nextPage:
          type:
            - integer
            - "null"
      required:
        - items
        - nextCursor
        - nextPage
    MediaUpdateRequest:
      type: object
      description: Update request for media metadata.
      properties:
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      anyOf:
        - required:
            - title
        - required:
            - tags
    MediaUpdate:
      type: object
      description: Updated media metadata.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        filename:
          type: string
        sizeBytes:
          type: integer
        mimeType:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - filename
        - sizeBytes
        - mimeType
        - thumbState
        - textState
        - tags
    MediaUpdateResponse:
      type: object
      description: Media update response envelope.
      properties:
        media:
          $ref: "#/components/schemas/MediaUpdate"
      required:
        - media
    MediaDeleteResponse:
      type: object
      description: Delete acknowledgement response.
      properties:
        ok:
          type: boolean
      required:
        - ok
    MediaDownloadResponse:
      type: object
      description: Presigned download URL response.
      properties:
        url:
          type: string
      required:
        - url
    MediaTextChunk:
      type: object
      description: Chunk of extracted text.
      properties:
        text:
          type: string
        offset:
          type: integer
        limit:
          type: integer
        totalLength:
          type: integer
        hasMore:
          type: boolean
        textSource:
          $ref: "#/components/schemas/TextSource"
      required:
        - text
        - offset
        - limit
        - totalLength
        - hasMore
        - textSource
    TextExtractionRequest:
      type: object
      description: Options for re-running text extraction.
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 12
        rotation:
          type: string
          enum:
            - "0"
            - "90"
            - "180"
            - "270"
        forceOcr:
          type: boolean
    OkResponse:
      type: object
      description: Generic ok response.
      properties:
        ok:
          type: boolean
      required:
        - ok
    ImageGps:
      type: object
      description: GPS coordinates extracted from image metadata.
      properties:
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type:
            - number
            - "null"
      required:
        - latitude
        - longitude
    ImageMetadata:
      type: object
      description: Image metadata fields, when available.
      properties:
        make:
          type:
            - string
            - "null"
        model:
          type:
            - string
            - "null"
        lens:
          type:
            - string
            - "null"
        iso:
          type:
            - number
            - "null"
        exposureTime:
          type:
            - number
            - "null"
        fNumber:
          type:
            - number
            - "null"
        focalLengthMm:
          type:
            - number
            - "null"
        orientation:
          type:
            - number
            - "null"
        colorSpace:
          type:
            - string
            - "null"
        editedBy:
          type:
            - string
            - "null"
        capturedAt:
          type:
            - string
            - "null"
        width:
          type:
            - number
            - "null"
        height:
          type:
            - number
            - "null"
        bitDepth:
          type:
            - number
            - "null"
        hasAlpha:
          type:
            - boolean
            - "null"
        gps:
          anyOf:
            - $ref: "#/components/schemas/ImageGps"
            - type: "null"
    PdfMetadata:
      type: object
      description: PDF metadata fields, when available.
      properties:
        title:
          type:
            - string
            - "null"
        author:
          type:
            - string
            - "null"
        subject:
          type:
            - string
            - "null"
        producer:
          type:
            - string
            - "null"
        creator:
          type:
            - string
            - "null"
        pdfVersion:
          type:
            - string
            - "null"
        pageCount:
          type:
            - number
            - "null"
        encrypted:
          type:
            - boolean
            - "null"
        createdAt:
          type:
            - string
            - "null"
        modifiedAt:
          type:
            - string
            - "null"
    OfficeMetadata:
      type: object
      description: Office document metadata fields, when available.
      properties:
        application:
          type:
            - string
            - "null"
        appVersion:
          type:
            - string
            - "null"
        lastModifiedBy:
          type:
            - string
            - "null"
        revision:
          type:
            - number
            - "null"
        language:
          type:
            - string
            - "null"
        hasComments:
          type:
            - boolean
            - "null"
        hasTrackedChanges:
          type:
            - boolean
            - "null"
    TextStats:
      type: object
      description: Computed text statistics for extracted content.
      properties:
        totalChars:
