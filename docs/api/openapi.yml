    patch:
      summary: Rename or recolor a tag
      tags:
        - Tags
      operationId: tags_update
      parameters:
        - in: path
          name: tag
          required: true
          schema:
            type: string
          description: Tag name (will be normalized before update).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatchRequest"
            examples:
              rename:
                value:
                  name: "receipts"
              recolor:
                value:
                  color: "#ff5733"
              clearColor:
                value:
                  color: null
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPatchResponse"
              examples:
                renamed:
                  value:
                    ok: true
                    tag: "receipt"
                    newName: "receipts"
                    affected: 12
                recolored:
                  value:
                    ok: true
                    tag: "receipt"
        "400":
          description: Invalid tag name or no fields to update
