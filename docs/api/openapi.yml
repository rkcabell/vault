openapi: 3.1.0
info:
  title: Vault API
  version: 0.1.0
  description: |
    Vault HTTP JSON API.

    Conventions:
    - JSON request/response bodies use `application/json` unless otherwise noted.
    - Error responses use the `ErrorResponse` schema.
    - Pagination: list endpoints use `limit` with cursor-based pagination via `cursor`/`nextCursor`. The media list also supports page-based pagination via `page`/`nextPage` when `cursor` is omitted. Max `limit` for media list is 100.
    - IDs are strings; media IDs are validated as UUIDs in path parameters.
    - Timestamps are RFC3339 `date-time` strings.
    - Auth: `requireAuth` prefers `Authorization: Bearer <token>` and falls back to the `access_token` cookie. `/api/auth/me` is cookie-only.
    - Query array params use `style: form` with `explode: true` (e.g., `tags=one&tags=two`).
servers:
  - url: http://127.0.0.1:8000
    description: Local dev
tags:
  - name: Auth
  - name: Profile
  - name: Media
  - name: Tags
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/auth/me:
    get:
      summary: Get the current user
      description: Reads the `access_token` cookie.
      tags:
        - Auth
      operationId: auth_me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      avatarUrl: "https://cdn.example.com/avatar.png"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      operationId: auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
            examples:
              register:
                value:
                  email: "user@example.com"
                  password: "correct-horse-battery"
      responses:
        "200":
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access"
                    refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "User already exists"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  $ref: "#/components/examples/ErrorRateLimited"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/auth/login:
    post:
      summary: Log in and set auth cookies
      description: Sets `access_token` and `refresh_token` cookies.
      tags:
        - Auth
      operationId: auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            examples:
              login:
                value:
                  email: "user@example.com"
                  password: "correct-horse-battery"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Invalid email or password format"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: "Unauthorized"
                    message: "Invalid credentials"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  $ref: "#/components/examples/ErrorRateLimited"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/auth/refresh:
    post:
      summary: Refresh the access token
      tags:
        - Auth
      operationId: auth_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
            examples:
              refresh:
                value:
                  refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
              examples:
                success:
                  value:
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: "Unauthorized"
                    message: "Invalid or expired refresh token"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  $ref: "#/components/examples/ErrorRateLimited"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/profile:
    get:
      summary: Get the current user's profile
      tags:
        - Profile
      operationId: profile_get
      responses:
        "200":
          description: Profile payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              examples:
                success:
                  value:
                    profile:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      bio: "Scanning everything."
                      website: "https://example.com"
                      location: "Seattle, WA"
                      avatarUrl: "https://cdn.example.com/avatar.png"
                      createdAt: "2026-01-29T18:35:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  $ref: "#/components/examples/ErrorNotFound"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
    patch:
      summary: Update the current user's profile
      tags:
        - Profile
      operationId: profile_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatchRequest"
            examples:
              update:
                value:
                  name: "Casey"
                  bio: "Scanning everything."
                  location: "Seattle, WA"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              examples:
                success:
                  value:
                    profile:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      bio: "Scanning everything."
                      website: null
                      location: "Seattle, WA"
                      avatarUrl: null
                      createdAt: "2026-01-29T18:35:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  $ref: "#/components/examples/ErrorNotFound"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/media:
    post:
      summary: Initialize a media upload
      tags:
        - Media
      operationId: media_initUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInitUploadRequest"
            examples:
              init:
                value:
                  filename: "receipt.pdf"
                  mimeType: "application/pdf"
                  sizeBytes: 24576
                  title: "January receipt"
                  tags:
                    - "receipt"
                    - "2026"
      responses:
        "200":
          description: Upload initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInitUploadResponse"
              examples:
                success:
                  value:
                    id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    uploadUrl: "https://s3.example.com/presigned-put"
                    storageKey: "usr_123/7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9/receipt.pdf"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "receipt.pdf exceeds the documents limit (250 MB max)."
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
    get:
      summary: List media for the current user
      description: If `cursor` is provided, `page` is ignored.
      tags:
        - Media
      operationId: media_list
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search text (alias of `search`).
        - in: query
          name: search
          schema:
            type: string
          description: Search text (alias of `q`).
        - in: query
          name: tag
          schema:
            type: string
          description: Single tag filter. Mutually exclusive with `tags`.
        - in: query
          name: tags
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Multiple tag filters. Mutually exclusive with `tag`.
        - in: query
          name: thumbState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: textState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/MediaSortOption"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number when not using cursor pagination.
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
              examples:
                cursorMode:
                  value:
                    items:
                      - id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                        title: "January receipt"
                        thumbState: "READY"
                        textState: "READY"
                        createdAt: "2026-01-29T18:35:00Z"
                        tags:
                          - "receipt"
                          - "application-pdf"
                        mimeType: "application/pdf"
                    nextCursor: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    nextPage: null
                pageMode:
                  value:
                    items:
                      - id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                        title: "January receipt"
                        thumbState: "READY"
                        textState: "READY"
                        createdAt: "2026-01-29T18:35:00Z"
                        tags:
                          - "receipt"
                          - "application-pdf"
                        mimeType: "application/pdf"
                    nextCursor: null
                    nextPage: 2
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  $ref: "#/components/examples/ErrorBadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/media/batch-init:
    post:
      summary: Initialize multiple uploads in a batch
      tags:
        - Media
      operationId: media_batchInit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaBatchInitRequest"
            examples:
              init:
                value:
                  items:
                    - filename: "receipt.pdf"
                      mimeType: "application/pdf"
                      sizeBytes: 24576
                      title: "January receipt"
                      tags: "receipt,2026"
                    - filename: "scan.png"
                      mimeType: "image/png"
                      sizeBytes: 10240
      responses:
        "200":
          description: Batch initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaBatchInitResponse"
              examples:
                success:
                  value:
                    items:
                      - id: "8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da"
                        storageKey: "usr_123/8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da/receipt.pdf"
                        putUrl: "https://s3.example.com/presigned-put-1"
                      - id: "b5d3adbb-2bd5-4b22-9412-7d1c54a89b7b"
                        storageKey: "usr_123/b5d3adbb-2bd5-4b22-9412-7d1c54a89b7b/scan.png"
                        putUrl: "https://s3.example.com/presigned-put-2"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Tags may only contain lowercase letters, digits, and dashes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/media/batch-finalize:
    post:
      summary: Finalize multiple uploads
      tags:
        - Media
      operationId: media_batchFinalize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaBatchFinalizeRequest"
            examples:
              finalize:
                value:
                  ids:
                    - "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    - "8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da"
      responses:
        "200":
          description: Batch finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFinalizeResponse"
              examples:
                success:
                  value:
                    ok: true
                    count: 2
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/media/{id}/finalize:
    post:
      summary: Finalize a single upload
      tags:
        - Media
      operationId: media_finalize
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFinalizeResponse"
              examples:
                success:
                  value:
                    ok: true
                    count: 1
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/media/tags:
    get:
      summary: List top tags for the current user (media)
      tags:
        - Media
      operationId: media_listTags
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of tags to return.
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTagsResponse"
              examples:
                success:
                  value:
                    tags:
                      - tag: "receipt"
                        count: 12
                      - tag: "application-pdf"
                        count: 9
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
  /api/media/{id}:
    get:
      summary: Get media detail
      tags:
        - Media
      operationId: media_getDetail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Media detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDetailResponse"
              examples:
                success:
                  value:
                    media:
                      id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      userId: "usr_123"
                      title: "January receipt"
                      filename: "receipt.pdf"
                      mimeType: "application/pdf"
                      sizeBytes: 24576
                      storageKey: "usr_123/7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9/receipt.pdf"
                      createdAt: "2026-01-29T18:35:00Z"
                      updatedAt: "2026-01-29T18:35:30Z"
                      tags:
                        - "receipt"
                        - "application-pdf"
                      thumbState: "READY"
                      thumbError: null
                      textState: "READY"
                      thumbnailKey: "usr_123/7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9/thumb.webp"
                      hasText: true
                      hasThumb: true
                      textError: null
                      textAttemptsMade: null
                      textAttemptsTotal: null
                    document:
                      rawText: "Lorem ipsum..."
                      textSource: "OCR"
                      textTotalLength: 1200
                      textLanguage: "English"
                      textLanguageStatus: "ok"
                    metadata:
                      text:
                        totalChars: 1200
                        totalWords: 220
                        pageCount: 1
                        pagesWithText: 1
                        avgCharsPerPage: 1200
                        avgWordsPerPage: 220
                      pdf:
                        pageCount: 1
                        encrypted: false
                    permissions:
                      canEdit: true
                      canDelete: true
                      canDownload: true
                      canOcr: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "404":
          description: Media not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  $ref: "#/components/examples/ErrorNotFound"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  $ref: "#/components/examples/ErrorInternalServer"
    patch:
      summary: Update media metadata
      tags:
        - Media
      operationId: media_update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdateRequest"
            examples:
              update:
                value:
                  title: "January receipt (updated)"
                  tags:
                    - "receipt"
                    - "2026"
      responses:
        "200":
          description: Updated media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpdateResponse"
              examples:
                success:
                  value:
                    media:
                      id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      title: "January receipt (updated)"
                      filename: "receipt.pdf"
                      sizeBytes: 24576
                      mimeType: "application/pdf"
                      thumbState: "READY"
                      textState: "READY"
                      tags:
                        - "receipt"
                        - "2026"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Provide a title or tags to update"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "404":
          description: Media not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
