      responses:
        "200":
          description: Media deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/{id}/download:
    get:
      summary: Get a presigned download URL
      tags:
        - Media
      operationId: media_getDownloadUrl
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDownloadResponse"
              examples:
                success:
                  value:
                    url: "https://s3.example.com/presigned-get"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/{id}/text:
    get:
      summary: Get a chunk of extracted text
      tags:
        - Media
      operationId: media_getText
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 4000
      responses:
        "200":
          description: Text chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTextChunk"
              examples:
                success:
                  value:
                    text: "Lorem ipsum..."
                    offset: 0
                    limit: 4000
                    totalLength: 12000
                    hasMore: true
                    textSource: "OCR"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Re-run text extraction
      tags:
        - Media
      operationId: media_rerunTextExtraction
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextExtractionRequest"
            examples:
              enqueue:
                value:
                  language: "eng"
                  rotation: "0"
                  forceOcr: false
      responses:
        "200":
          description: OCR job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
