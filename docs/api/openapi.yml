      parameters:
        - in: path
          name: tag
          required: true
          schema:
            type: string
          description: Tag name (will be normalized before deletion).
      responses:
        "200":
          description: Tag deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDeleteResponse"
              examples:
                success:
                  value:
                    ok: true
                    tag: "receipt"
        "400":
          description: Invalid tag name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Tags may only contain lowercase letters, digits, and dashes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

