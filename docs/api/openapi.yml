  # ---------------------------------------------------------------------------
  # Reminders
  # ---------------------------------------------------------------------------
  /api/reminders/summary:
    get:
      summary: Get reminder counts by bucket
      tags:
        - Reminders
      operationId: reminders_summary
      responses:
        "200":
          description: Reminder summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSummaryStats"
              examples:
                success:
                  value:
                    visibleNow: 3
                    overdue: 1
                    dueToday: 1
                    dueSoon: 1
                    totalActive: 5
                    soonWindowDays: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders:
    get:
      summary: List reminders
      description: |
        - `status=active` (default) returns active reminders sorted by urgency.
        - `status=completed` returns completed reminders, only supports `view=all`.
        - `view=overview` (default) returns a limited set grouped by bucket; `view=all` returns a flat list.
        - `status=canceled` is not supported.
      tags:
        - Reminders
      operationId: reminders_list
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - completed
          description: Filter by reminder status. Defaults to `active`.
        - in: query
          name: view
          schema:
            type: string
            enum:
              - overview
              - all
          description: |
            `overview` returns a capped list per bucket; `all` returns the full flat list.
            `completed` status only supports `view=all`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
          description: Maximum items to return. Applies per-bucket in `overview` view.
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
              examples:
                active:
                  value:
                    items:
                      - id: "a1b2c3d4-0000-0000-0000-000000000001"
                        title: "Renew car insurance"
                        note: "Check inbox for renewal notice"
                        media:
                          id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                          title: "Insurance policy"
                        effectiveDueAt: "2026-03-20T00:00:00Z"
                        remindAt: "2026-03-13T00:00:00Z"
                        snoozedUntil: null
                        bucket: "soon"
                        isOverdue: false
                        remindOffsetDays: 7
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a reminder
      tags:
        - Reminders
      operationId: reminders_create
      parameters:
        - in: header
          name: x-timezone
          schema:
            type: string
          description: IANA timezone identifier (e.g. `America/New_York`). Defaults to UTC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
            examples:
              simple:
                value:
                  title: "Renew car insurance"
                  dueAt: "2026-03-20T00:00:00Z"
                  remindOffsetDays: 7
                  mediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
              recurring:
                value:
                  title: "Monthly budget review"
                  dueAt: "2026-04-01T00:00:00Z"
                  rrule: "FREQ=MONTHLY;BYMONTHDAY=1"
      responses:
        "201":
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
              examples:
                success:
                  value:
                    reminder:
                      id: "a1b2c3d4-0000-0000-0000-000000000001"
                      userId: "usr_123"
                      title: "Renew car insurance"
                      note: null
                      mediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      status: "ACTIVE"
                      timezone: "UTC"
                      dueAt: "2026-03-20T00:00:00Z"
                      nextDueAt: null
                      remindOffsetDays: 7
                      remindAt: "2026-03-13T00:00:00Z"
                      snoozedUntil: null
                      rrule: null
                      lastCompletedAt: null
                      createdAt: "2026-03-17T00:00:00Z"
                      updatedAt: "2026-03-17T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}:
    patch:
      summary: Update a reminder
      tags:
        - Reminders
      operationId: reminders_update
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchReminderRequest"
            examples:
              update:
                value:
                  title: "Renew car insurance (updated)"
                  remindOffsetDays: 14
      responses:
        "200":
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}/complete:
    post:
      summary: Mark a reminder complete
      description: |
        For one-off reminders, sets status to `COMPLETED`. For recurring reminders
        (with `rrule`), advances to the next occurrence and stays `ACTIVE`,
        updating `lastCompletedAt`.
      tags:
        - Reminders
      operationId: reminders_complete
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Reminder completed (or advanced to next recurrence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          description: Reminder is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}/snooze:
    post:
      summary: Snooze a reminder until a future time
      tags:
        - Reminders
      operationId: reminders_snooze
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnoozeReminderRequest"
            examples:
              snooze:
                value:
                  until: "2026-03-18T09:00:00Z"
      responses:
        "200":
          description: Reminder snoozed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          description: "`until` is in the past or reminder is not ACTIVE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}/cancel:
    post:
      summary: Cancel a reminder
      tags:
        - Reminders
      operationId: reminders_cancel
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Reminder cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/reminders/{id}/unsnooze:
    post:
      summary: Clear a reminder's snooze
      tags:
        - Reminders
      operationId: reminders_unsnooze
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Snooze cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          description: Reminder is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Preferences
  # ---------------------------------------------------------------------------
  /api/preferences:
    get:
      summary: Get the current user's preferences
      tags:
        - Preferences
      operationId: preferences_get
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
              examples:
                success:
                  value:
                    preferences:
                      libraryViewMode: "grid"
                      libraryGridCols: 5
                      libraryIsCompactList: false
                      autoTagOnUpload: true
                      extractMetadata: true
                      detectDuplicates: false
                      lowMemoryMode: false
                      autoUnpackArchives: false
                      hideUnpackedItems: false
                      soonWindowDays: 7
                      themePreference: "system"
                      yellowHighlight: false
                      lightTheme: "default"
                      darkTheme: "new-moon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update the current user's preferences
      tags:
        - Preferences
      operationId: preferences_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesPatchRequest"
            examples:
              update:
                value:
                  libraryViewMode: "list"
                  themePreference: "dark"
                  darkTheme: "matrix"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Server
  # ---------------------------------------------------------------------------
  /api/server/status:
    get:
      summary: Get server runtime status
      tags:
        - Server
      operationId: server_status
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatusResponse"
              examples:
                success:
                  value:
                    env: "production"
                    apiPort: 8000
                    corsOrigin: "http://localhost"
                    uptimeSeconds: 3600
                    memoryMB: 128
                    minioConsoleUrl: "http://localhost:9001/browser/vault-media"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/server/storage:
    get:
      summary: Get storage usage statistics
      tags:
        - Server
      operationId: server_storage
      responses:
        "200":
          description: Storage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStorageResponse"
              examples:
                success:
                  value:
                    sizeBytes: 104857600
                    objectCount: 250
                    dbSizeBytes: 52428800
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/server/workers:
    get:
      summary: Get worker queue status
      tags:
        - Server
      operationId: server_workers
      responses:
        "200":
          description: Worker queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWorkersResponse"
              examples:
                success:
                  value:
                    ocr:
                      active: true
                      count: 1
                      counts:
                        waiting: 0
                        active: 1
                        delayed: 0
                        failed: 0
                    thumb:
                      active: true
                      count: 1
                      counts:
                        waiting: 2
                        active: 1
                        delayed: 0
                        failed: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Init
  # ---------------------------------------------------------------------------
  /api/init:
    get:
      summary: Bootstrap initial app data
      description: |
        Returns all data needed to bootstrap the app in a single request:
        user profile, preferences, tags, bundles, reminder summary counts,
        and the reminder overview.
      tags:
        - Init
      operationId: init_get
      responses:
        "200":
          description: Bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      avatarUrl: null
                    preferences:
                      libraryViewMode: "grid"
                      themePreference: "system"
                    tags:
                      - name: "receipt"
                        count: 12
                        color: null
                    bundles:
                      - id: "c1d2e3f4-0001-0000-0000-000000000001"
                        name: "Tax documents 2025"
                        starred: true
                        itemCount: 7
                    remindersSummary:
                      visibleNow: 3
                      overdue: 1
                      dueToday: 1
                      dueSoon: 1
                      totalActive: 5
                      soonWindowDays: 7
                    overviewReminders:
                      items: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      summary: Liveness check
      tags:
        - Health
      operationId: health_liveness
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
  /readyz:
    get:
      summary: Readiness check
      description: Performs a database connectivity check (`SELECT 1`).
      tags:
        - Health
      operationId: health_readiness
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required:
                  - ready
              examples:
                success:
                  value:
                    ready: true
        "500":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  # ---------------------------------------------------------------------------
  # Reusable parameters
  # ---------------------------------------------------------------------------
  parameters:
    MediaId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Media ID (UUID).
    BundleId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Bundle ID.
    ReminderId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Reminder ID (UUID).

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badRequest:
              $ref: "#/components/examples/ErrorBadRequest"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              $ref: "#/components/examples/ErrorUnauthorized"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              $ref: "#/components/examples/ErrorNotFound"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimited:
              $ref: "#/components/examples/ErrorRateLimited"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            serverError:
              $ref: "#/components/examples/ErrorInternalServer"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    ErrorResponse:
      type: object
      description: Error response payload from Fastify and rate limiting.
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        limit:
          type: integer
        windowMs:
          type: integer

    OkResponse:
      type: object
      description: Generic acknowledgement response.
      properties:
        ok:
          type: boolean
      required:
        - ok

    # --- Auth ---
    User:
      type: object
      description: User summary returned by auth endpoints.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        username:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
      required:
        - id
        - email
    AuthRegisterRequest:
      type: object
      description: Registration credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthRegisterResponse:
      type: object
      description: User and tokens returned after registration.
      properties:
        user:
          $ref: "#/components/schemas/User"
        access:
          type: string
        refresh:
          type: string
      required:
        - user
        - access
        - refresh
    AuthLoginRequest:
      type: object
      description: Login credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthLoginResponse:
      type: object
      description: User returned after login. Tokens are set as httpOnly cookies.
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    AuthRefreshRequest:
      type: object
      description: Refresh token payload.
      properties:
        refresh:
          type: string
      required:
        - refresh
    AuthRefreshResponse:
      type: object
      description: New access token.
      properties:
        access:
          type: string
      required:
        - access
    AuthMeResponse:
      type: object
      description: Current user response.
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    # --- Profile ---
    Profile:
      type: object
      description: Profile details for the current user.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        username:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        website:
          type: [string, "null"]
        location:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - username
        - bio
        - website
        - location
        - avatarUrl
        - createdAt
    ProfileResponse:
      type: object
      description: Profile response envelope.
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - profile
    ProfilePatchRequest:
      type: object
      description: Profile fields to update (all optional).
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 200
        username:
          type: [string, "null"]
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 1000
        website:
          type: [string, "null"]
          maxLength: 200
        location:
          type: [string, "null"]
          maxLength: 200
        avatarUrl:
          type: [string, "null"]
          maxLength: 400

    # --- Media shared ---
    MediaWorkerState:
      type: string
      description: Background processing state.
      enum:
        - PENDING
        - READY
        - ERROR
        - FAILED
    MediaSortOption:
      type: string
      description: Sort options for media listing.
      enum:
        - createdAt_desc
        - createdAt_asc
        - title_asc
        - title_desc
        - size_desc
        - size_asc
        - mimeType_asc
    TextSource:
      type: string
      description: Source of extracted text.
      enum:
        - OCR
        - NATIVE
        - UNKNOWN
    TextLanguageStatus:
      type: string
      description: Language detection status.
      enum:
        - ok
        - short
        - error
    TagInput:
      description: Tag list as a comma-separated string or array of strings.
      oneOf:
        - type: string
        - type: array
          items:
            type: string

    # --- Media upload ---
    MediaInitUploadRequest:
      type: object
      description: Request to initialize an upload and receive a presigned PUT URL.
      properties:
        filename:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 1
          description: Size limits — 50 MB for photos, 250 MB for documents, 500 MB hard cap.
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      required:
        - filename
        - mimeType
        - sizeBytes
        - title
    MediaInitUploadResponse:
      type: object
      description: Upload initialization response.
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
        storageKey:
          type: string
      required:
        - id
        - uploadUrl
        - storageKey
    MediaBatchInitRequestItem:
      type: object
      description: Single item for batch upload initialization.
      properties:
        filename:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      required:
        - filename
        - mimeType
        - sizeBytes
    MediaBatchInitRequest:
      type: object
      description: Batch upload initialization request (1–100 items).
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MediaBatchInitRequestItem"
      required:
        - items
    MediaBatchInitResponseItem:
      type: object
      description: Batch upload initialization result for one item.
      properties:
        id:
          type: string
          format: uuid
        storageKey:
          type: string
        putUrl:
          type: string
      required:
        - id
        - storageKey
        - putUrl
    MediaBatchInitResponse:
      type: object
      description: Batch upload initialization response.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaBatchInitResponseItem"
      required:
        - items
    MediaBatchFinalizeRequest:
      type: object
      description: Finalize multiple uploads (1–100 IDs).
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
      required:
        - ids
    MediaFinalizeResponse:
      type: object
      description: Finalize result.
      properties:
        ok:
          type: boolean
        count:
          type: integer
      required:
        - ok
        - count

    # --- Media list/detail ---
    MediaSummary:
      type: object
      description: Summary item returned by media list.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        mimeType:
          type: string
      required:
        - id
        - thumbState
        - textState
        - createdAt
        - tags
        - mimeType
    MediaListResponse:
      type: object
      description: Paginated media list response.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaSummary"
        nextCursor:
          type: [string, "null"]
        nextPage:
          type: [integer, "null"]
      required:
        - items
        - nextCursor
        - nextPage
    MediaUpdateRequest:
      type: object
      description: Update request for media metadata. At least one field required.
      properties:
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      anyOf:
        - required: [title]
        - required: [tags]
    MediaUpdate:
      type: object
      description: Updated media metadata.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        filename:
          type: string
        sizeBytes:
          type: [integer, "null"]
        mimeType:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - filename
        - mimeType
        - thumbState
        - textState
        - tags
    MediaUpdateResponse:
      type: object
      description: Media update response envelope.
      properties:
        media:
          $ref: "#/components/schemas/MediaUpdate"
      required:
        - media
    MediaDownloadResponse:
      type: object
      description: Presigned download URL response.
      properties:
        url:
          type: string
      required:
        - url
    MediaTextChunk:
      type: object
      description: Chunk of extracted text with pagination metadata.
      properties:
        text:
          type: string
        offset:
          type: integer
        limit:
          type: integer
        totalLength:
          type: integer
        hasMore:
          type: boolean
        textSource:
          anyOf:
            - $ref: "#/components/schemas/TextSource"
            - type: "null"
      required:
        - text
        - offset
        - limit
        - totalLength
        - hasMore
    TextExtractionRequest:
      type: object
      description: Options for re-running text extraction.
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 12
          description: ISO 639 language hint for Tesseract (e.g. `eng`, `fra`).
        rotation:
          type: string
          enum: ["0", "90", "180", "270"]
          description: Page rotation to apply before OCR.
        forceOcr:
          type: boolean
          description: Force OCR even if native text is available.
    ImageGps:
      type: object
      description: GPS coordinates extracted from image metadata.
      properties:
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: [number, "null"]
      required:
        - latitude
        - longitude
    ImageMetadata:
      type: object
      description: Image metadata extracted from EXIF.
      properties:
        make:
          type: [string, "null"]
        model:
          type: [string, "null"]
        lens:
          type: [string, "null"]
        iso:
          type: [number, "null"]
        exposureTime:
          type: [number, "null"]
        fNumber:
          type: [number, "null"]
        focalLengthMm:
          type: [number, "null"]
        orientation:
          type: [number, "null"]
        colorSpace:
          type: [string, "null"]
        editedBy:
          type: [string, "null"]
        capturedAt:
          type: [string, "null"]
        width:
          type: [number, "null"]
        height:
          type: [number, "null"]
        bitDepth:
          type: [number, "null"]
        hasAlpha:
          type: [boolean, "null"]
        gps:
          anyOf:
            - $ref: "#/components/schemas/ImageGps"
            - type: "null"
    PdfMetadata:
      type: object
      description: PDF document metadata.
      properties:
        title:
          type: [string, "null"]
        author:
          type: [string, "null"]
        subject:
          type: [string, "null"]
        producer:
          type: [string, "null"]
        creator:
          type: [string, "null"]
        pdfVersion:
          type: [string, "null"]
        pageCount:
          type: [number, "null"]
        encrypted:
          type: [boolean, "null"]
        createdAt:
          type: [string, "null"]
        modifiedAt:
          type: [string, "null"]
    OfficeMetadata:
      type: object
      description: Office document metadata.
      properties:
        application:
          type: [string, "null"]
        appVersion:
          type: [string, "null"]
        lastModifiedBy:
          type: [string, "null"]
        revision:
          type: [number, "null"]
        language:
          type: [string, "null"]
        hasComments:
          type: [boolean, "null"]
        hasTrackedChanges:
          type: [boolean, "null"]
    TextStats:
      type: object
      description: Computed statistics for extracted text.
      properties:
        totalChars:
          type: [number, "null"]
        totalWords:
          type: [number, "null"]
        pageCount:
          type: [number, "null"]
        pagesWithText:
          type: [number, "null"]
        avgCharsPerPage:
          type: [number, "null"]
        avgWordsPerPage:
          type: [number, "null"]
    MediaMetadata:
      type: object
      description: Derived metadata for a media item.
      properties:
        image:
          anyOf:
            - $ref: "#/components/schemas/ImageMetadata"
            - type: "null"
        pdf:
          anyOf:
            - $ref: "#/components/schemas/PdfMetadata"
            - type: "null"
        office:
          anyOf:
            - $ref: "#/components/schemas/OfficeMetadata"
            - type: "null"
        text:
          anyOf:
            - $ref: "#/components/schemas/TextStats"
            - type: "null"
    MediaPermissions:
      type: object
      description: Permission flags for the authenticated user on this media item.
      properties:
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        canDownload:
          type: boolean
        canOcr:
          type: boolean
      required:
        - canEdit
        - canDelete
        - canDownload
        - canOcr
    DocumentDetail:
      type: object
      description: Extracted text detail for a document.
      properties:
        rawText:
          type: string
        textSource:
          anyOf:
            - $ref: "#/components/schemas/TextSource"
            - type: "null"
        textTotalLength:
          type: integer
        textLanguage:
          type: [string, "null"]
        textLanguageStatus:
          anyOf:
            - $ref: "#/components/schemas/TextLanguageStatus"
            - type: "null"
      required:
        - rawText
        - textTotalLength
    MediaDetail:
      type: object
      description: Full media record with derived fields.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        title:
          type: [string, "null"]
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: [integer, "null"]
        storageKey:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        thumbError:
          type: [string, "null"]
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        thumbnailKey:
          type: [string, "null"]
        hasText:
          type: boolean
        hasThumb:
          type: boolean
        textError:
          type: [string, "null"]
        textAttemptsMade:
          type: [integer, "null"]
        textAttemptsTotal:
          type: [integer, "null"]
      required:
        - id
        - userId
        - filename
        - mimeType
        - storageKey
        - createdAt
        - updatedAt
        - tags
        - thumbState
        - textState
        - hasText
        - hasThumb
    MediaDetailResponse:
      type: object
      description: Media detail response envelope.
      properties:
        media:
          $ref: "#/components/schemas/MediaDetail"
        document:
          anyOf:
            - $ref: "#/components/schemas/DocumentDetail"
            - type: "null"
        metadata:
          anyOf:
            - $ref: "#/components/schemas/MediaMetadata"
            - type: "null"
        permissions:
          anyOf:
            - $ref: "#/components/schemas/MediaPermissions"
            - type: "null"
      required:
        - media
        - document
        - metadata

    # --- Tags ---
    TagCount:
      type: object
      description: Tag name with usage count and optional color.
      properties:
        name:
          type: string
        count:
          type: integer
        color:
          type: [string, "null"]
          description: Hex color string (e.g. `#ff5733`) or null.
      required:
        - name
        - count
    TagsResponse:
      type: object
      description: Tag list response with pagination metadata.
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
      required:
        - tags
        - total
        - offset
        - limit
    TagPatchRequest:
      type: object
      description: Fields to update on a tag (at least one required).
      properties:
        name:
          type: string
          minLength: 1
          description: New tag name (will be normalized).
        color:
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Hex color string or null to clear.
    TagPatchResponse:
      type: object
      description: Result of a tag update.
      properties:
        ok:
          type: boolean
        tag:
          type: string
          description: Original tag name.
        newName:
          type: string
          description: Normalized new name (only present on rename).
        affected:
          type: integer
          description: Number of media items updated (only present on rename).
      required:
        - ok
        - tag
    TagDeleteResponse:
      type: object
      description: Tag deletion response.
      properties:
        ok:
          type: boolean
        tag:
          type: string
      required:
        - ok
        - tag

    # --- Bundles ---
    BundleSummary:
      type: object
      description: Bundle summary returned in list responses.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        starred:
          type: boolean
        itemCount:
          type: integer
        coverMediaId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - starred
        - itemCount
        - createdAt
        - updatedAt
    BundleItem:
      type: object
      description: A media item within a bundle.
      properties:
        mediaId:
          type: string
          format: uuid
        order:
          type: integer
        addedAt:
          type: string
          format: date-time
        title:
          type: [string, "null"]
        mimeType:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        thumbnailKey:
          type: [string, "null"]
      required:
        - mediaId
        - order
        - addedAt
        - mimeType
        - thumbState
    BundleDetail:
      description: Bundle summary with its ordered item list.
      allOf:
        - $ref: "#/components/schemas/BundleSummary"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BundleItem"
          required:
            - items
    BundleListResponse:
      type: object
      description: Bundle list response envelope.
      properties:
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/BundleSummary"
      required:
        - bundles
    BundleSummaryResponse:
      type: object
      description: Single bundle summary response envelope.
      properties:
        bundle:
          $ref: "#/components/schemas/BundleSummary"
      required:
        - bundle
    BundleDetailResponse:
      type: object
      description: Bundle detail response envelope.
      properties:
        bundle:
          $ref: "#/components/schemas/BundleDetail"
      required:
        - bundle
    BundleCreateRequest:
      type: object
      description: Request to create a new bundle.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
      required:
        - name
    BundlePatchRequest:
      type: object
      description: Update bundle fields (at least one field required).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 1000
        starred:
          type: boolean
        coverMediaId:
          type: [string, "null"]
          format: uuid
    BundleAddItemsRequest:
      type: object
      description: Add media items to a bundle (1–100 IDs).
      properties:
        mediaIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
      required:
        - mediaIds
    BundleOrderRequest:
      type: object
      description: Reorder items in a bundle by providing the full ordered list of media IDs.
      properties:
        orderedIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
      required:
        - orderedIds
    BundleStarResponse:
      type: object
      description: Result of toggling the starred state.
      properties:
        ok:
          type: boolean
        starred:
          type: boolean
      required:
        - ok
        - starred

    # --- Reminders ---
    ReminderStatus:
      type: string
      description: Lifecycle state of a reminder.
      enum:
        - ACTIVE
        - COMPLETED
        - CANCELED
    ReminderBucket:
      type: string
      description: Urgency bucket derived from due date relative to now.
      enum:
        - overdue
        - today
        - soon
        - later
    ReminderMediaRef:
      type: object
      description: Minimal media reference attached to a reminder.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
      required:
        - id
    Reminder:
      type: object
      description: Full reminder record.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        title:
          type: string
        note:
          type: [string, "null"]
        mediaId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/ReminderStatus"
        timezone:
          type: string
          description: IANA timezone identifier.
        dueAt:
          type: string
          format: date-time
        nextDueAt:
          type: [string, "null"]
          format: date-time
          description: Next occurrence due date for recurring reminders.
        remindOffsetDays:
          type: [integer, "null"]
          description: Days before `dueAt` to surface the reminder.
        remindAt:
          type: string
          format: date-time
          description: Computed time when the reminder becomes visible (`dueAt - remindOffsetDays`).
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        rrule:
          type: [string, "null"]
          description: iCal RRULE string for recurring reminders.
        lastCompletedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - status
        - timezone
        - dueAt
        - remindAt
        - createdAt
        - updatedAt
    ReminderSummaryItem:
      type: object
      description: Reminder list item with derived urgency fields.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        note:
          type: [string, "null"]
        media:
          anyOf:
            - $ref: "#/components/schemas/ReminderMediaRef"
            - type: "null"
        effectiveDueAt:
          type: string
          format: date-time
          description: The active due date (nextDueAt for recurring, dueAt otherwise).
        remindAt:
          type: string
          format: date-time
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        bucket:
          $ref: "#/components/schemas/ReminderBucket"
        isOverdue:
          type: boolean
        remindOffsetDays:
          type: [integer, "null"]
      required:
        - id
        - title
        - effectiveDueAt
        - remindAt
        - bucket
        - isOverdue
    ReminderListResponse:
      type: object
      description: Reminder list response envelope.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReminderSummaryItem"
      required:
        - items
    ReminderResponse:
      type: object
      description: Single reminder response envelope.
      properties:
        reminder:
          $ref: "#/components/schemas/Reminder"
      required:
        - reminder
    ReminderSummaryStats:
      type: object
      description: Aggregate reminder counts by urgency bucket.
      properties:
        visibleNow:
          type: integer
          description: Total reminders that are currently visible (past remindAt).
        overdue:
          type: integer
        dueToday:
          type: integer
        dueSoon:
          type: integer
        totalActive:
          type: integer
        soonWindowDays:
          type: integer
          description: Number of days used to define the "soon" window.
      required:
        - visibleNow
        - overdue
        - dueToday
        - dueSoon
        - totalActive
        - soonWindowDays
    CreateReminderRequest:
      type: object
      description: Request to create a reminder.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        note:
          type: [string, "null"]
          maxLength: 5000
        mediaId:
          type: [string, "null"]
          format: uuid
          description: Optional media item to link to this reminder.
        dueAt:
          type: string
          format: date-time
          description: Due date. Must be in the future.
        remindOffsetDays:
          type: [integer, "null"]
          minimum: 0
          description: Days before `dueAt` to surface the reminder. Defaults to 0 (due date itself).
        rrule:
          type: [string, "null"]
          maxLength: 1000
          description: iCal RRULE string for recurring reminders (e.g. `FREQ=MONTHLY`).
      required:
        - title
        - dueAt
    PatchReminderRequest:
      type: object
      description: Update reminder fields (at least one field required).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        note:
          type: [string, "null"]
          maxLength: 5000
        mediaId:
          type: [string, "null"]
          format: uuid
        dueAt:
          type: string
          format: date-time
        remindOffsetDays:
          type: [integer, "null"]
          minimum: 0
        rrule:
          type: [string, "null"]
          maxLength: 1000
    SnoozeReminderRequest:
      type: object
      description: Snooze a reminder until a future datetime.
      properties:
        until:
          type: string
          format: date-time
          description: Must be in the future.
      required:
        - until

    # --- Media bulk ops ---
    BulkDeleteResponse:
      type: object
      description: Result of a bulk delete operation.
      properties:
        count:
          type: integer
          description: Number of media items deleted.
      required:
        - count
    BulkDownloadRequest:
      type: object
      description: List of media IDs to include in the zip (1–50).
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
      required:
        - ids

    # --- Preferences ---
    Preferences:
      type: object
      description: User preferences object.
      properties:
        libraryViewMode:
          type: string
          enum: [grid, list]
        libraryGridCols:
          type: integer
          enum: [4, 5, 6, 7, 8]
        libraryIsCompactList:
          type: boolean
        autoTagOnUpload:
          type: boolean
        extractMetadata:
          type: boolean
        detectDuplicates:
          type: boolean
        lowMemoryMode:
          type: boolean
        autoUnpackArchives:
          type: boolean
        hideUnpackedItems:
          type: boolean
        soonWindowDays:
          type: integer
          minimum: 2
          maximum: 14
        themePreference:
          type: string
          enum: [system, light, dark]
        yellowHighlight:
          type: boolean
        lightTheme:
          type: string
          enum: [default, latte, sandstone, mist, lavender, dream, cotton-candy, mint, garden]
        darkTheme:
          type: string
          enum: [new-moon, matrix, charcoal, solarized]
    PreferencesResponse:
      type: object
      description: Preferences response envelope.
      properties:
        preferences:
          $ref: "#/components/schemas/Preferences"
      required:
        - preferences
    PreferencesPatchRequest:
      type: object
      description: Preference fields to update (all optional, at least one expected).
      properties:
        libraryViewMode:
          type: string
          enum: [grid, list]
        libraryGridCols:
          type: integer
          enum: [4, 5, 6, 7, 8]
        libraryIsCompactList:
          type: boolean
        autoTagOnUpload:
          type: boolean
        extractMetadata:
          type: boolean
        detectDuplicates:
          type: boolean
        lowMemoryMode:
          type: boolean
        autoUnpackArchives:
          type: boolean
        hideUnpackedItems:
          type: boolean
        soonWindowDays:
          type: integer
          minimum: 2
          maximum: 14
        themePreference:
          type: string
          enum: [system, light, dark]
        yellowHighlight:
          type: boolean
        lightTheme:
          type: string
          enum: [default, latte, sandstone, mist, lavender, dream, cotton-candy, mint, garden]
        darkTheme:
          type: string
          enum: [new-moon, matrix, charcoal, solarized]
      additionalProperties: false

    # --- Server ---
    ServerStatusResponse:
      type: object
      description: Server runtime status.
      properties:
        env:
          type: string
          description: NODE_ENV value.
        apiPort:
          type: integer
        corsOrigin:
          type: string
        uptimeSeconds:
          type: number
        memoryMB:
          type: integer
          description: RSS memory usage in megabytes.
        minioConsoleUrl:
          type: string
      required:
        - env
        - apiPort
        - corsOrigin
        - uptimeSeconds
        - memoryMB
        - minioConsoleUrl
    ServerStorageResponse:
      type: object
      description: Storage usage statistics.
      properties:
        sizeBytes:
          type: integer
          description: Total S3 object size in bytes.
        objectCount:
          type: integer
          description: Total number of S3 objects.
        dbSizeBytes:
          type: integer
          description: Postgres database size in bytes.
      required:
        - sizeBytes
        - objectCount
        - dbSizeBytes
    WorkerQueueCounts:
      type: object
      description: Job counts for a single worker queue.
      properties:
        waiting:
          type: integer
        active:
          type: integer
        delayed:
          type: integer
        failed:
          type: integer
      required:
        - waiting
        - active
        - delayed
        - failed
    WorkerQueueStatus:
      type: object
      description: Status of a single worker queue.
      properties:
        active:
          type: boolean
          description: Whether at least one worker process is connected.
        count:
          type: integer
          description: Number of connected worker processes.
        counts:
          $ref: "#/components/schemas/WorkerQueueCounts"
      required:
        - active
        - count
        - counts
    ServerWorkersResponse:
      type: object
      description: Status of all worker queues.
      properties:
        ocr:
          $ref: "#/components/schemas/WorkerQueueStatus"
        thumb:
          $ref: "#/components/schemas/WorkerQueueStatus"
      required:
        - ocr
        - thumb

    # --- Init ---
    InitResponse:
      type: object
      description: Bootstrap payload returned on app load.
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        preferences:
          $ref: "#/components/schemas/Preferences"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/BundleSummary"
        remindersSummary:
          $ref: "#/components/schemas/ReminderSummaryStats"
        overviewReminders:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReminderSummaryItem"
          required:
            - items
      required:
        - user
        - preferences
        - tags
        - bundles
        - remindersSummary
        - overviewReminders

  # ---------------------------------------------------------------------------
  # Examples
  # ---------------------------------------------------------------------------
  examples:
    ErrorUnauthorized:
      value:
        statusCode: 401
        error: "Unauthorized"
        message: "Unauthorized"
    ErrorBadRequest:
      value:
        statusCode: 400
        error: "Bad Request"
        message: "Bad Request"
    ErrorNotFound:
      value:
        statusCode: 404
        error: "Not Found"
        message: "Not Found"
    ErrorRateLimited:
      value:
        error: "rate_limited"
        limit: 30
        windowMs: 60000
    ErrorInternalServer:
      value:
        statusCode: 500
        error: "Internal Server Error"
        message: "Internal Server Error"
