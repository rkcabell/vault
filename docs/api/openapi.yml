openapi: 3.1.0
info:
  title: Vault API
  version: 0.1.0
  description: |
    Vault HTTP JSON API.

    Conventions:
    - Request and response bodies are `application/json` unless noted.
    - Errors use the `ErrorResponse` schema.
    - List endpoints paginate with `limit` and `cursor`/`nextCursor`. Max `limit` for the media list is 100.
    - Media IDs are UUIDs.
    - Timestamps are RFC3339 `date-time` strings.
    - Auth prefers `Authorization: Bearer <token>` and falls back to the `access_token` cookie. `/api/auth/me` is cookie-only.
    - Multi-value filters (`tags`, `excludeTags`) are comma-separated strings, not repeated params.
servers:
  - url: http://127.0.0.1:8000
    description: Local dev
tags:
  - name: Auth
  - name: Profile
  - name: Media
  - name: Ingest
  - name: Indexing
  - name: Duplicates
  - name: Tags
  - name: Tag Rules
  - name: Bundles
  - name: Reminders
  - name: Preferences
  - name: Jobs
  - name: Sidecars
  - name: Storage
  - name: Server
  - name: Init
  - name: Health
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/auth/me:
    get:
      summary: Get the current user
      description: Reads the `access_token` cookie.
      tags:
        - Auth
      operationId: auth_me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      avatarUrl: "https://cdn.example.com/avatar.png"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      operationId: auth_register
      security: []
      x-rateLimit:
        max: 5
        timeWindow: "1 minute"
        keyBy: IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
            examples:
              register:
                value:
                  email: "user@example.com"
                  password: "correct-horse-battery"
      responses:
        "200":
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access"
                    refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "User already exists"
        "403":
          description: Registration is disabled on this server (`DISABLE_REGISTRATION`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      summary: Log in and set auth cookies
      description: Sets `access_token` (20 h) and `refresh_token` (7 d) httpOnly cookies.
      tags:
        - Auth
      operationId: auth_login
      security: []
      x-rateLimit:
        - max: 30
          timeWindow: "1 minute"
          keyBy: IP
        - max: 10
          timeWindow: "1 minute"
          keyBy: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            examples:
              login:
                value:
                  email: "user@example.com"
                  password: "correct-horse-battery"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Invalid email or password format"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: "Unauthorized"
                    message: "Invalid credentials"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/refresh:
    post:
      summary: Refresh the access token
      description: Replaces both cookies and returns the new tokens in the body. Prefers the `refresh_token` cookie, falling back to `refresh` in the body. Both cookies are cleared on 401.
      tags:
        - Auth
      operationId: auth_refresh
      security: []
      x-rateLimit:
        max: 60
        timeWindow: "1 minute"
        keyBy: IP
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
            examples:
              refresh:
                value:
                  refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
              examples:
                success:
                  value:
                    ok: true
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access"
                    refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
        "401":
          description: Missing, invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: "Unauthorized"
                    message: "Invalid or expired refresh token"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/logout:
    post:
      summary: Log out (clear auth cookies)
      description: Clears the auth cookies. Stateless JWTs stay valid until they expire or the user's tokenVersion changes.
      tags:
        - Auth
      operationId: auth_logout
      responses:
        "200":
          description: Cookies cleared
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  value: {}
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Profile
  # ---------------------------------------------------------------------------
  /api/profile:
    get:
      summary: Get the current user's profile
      tags:
        - Profile
      operationId: profile_get
      responses:
        "200":
          description: Profile payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              examples:
                success:
                  value:
                    profile:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      bio: "Scanning everything."
                      website: "https://example.com"
                      location: "Seattle, WA"
                      avatarUrl: "https://cdn.example.com/avatar.png"
                      createdAt: "2026-01-29T18:35:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update the current user's profile
      tags:
        - Profile
      operationId: profile_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatchRequest"
            examples:
              update:
                value:
                  name: "Casey"
                  bio: "Scanning everything."
                  location: "Seattle, WA"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              examples:
                success:
                  value:
                    profile:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      bio: "Scanning everything."
                      website: null
                      location: "Seattle, WA"
                      avatarUrl: null
                      createdAt: "2026-01-29T18:35:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Media
  # ---------------------------------------------------------------------------
  /api/media:
    get:
      summary: List media
      description: "`totalCount` and `hasExtractedItems` are returned on the first page only. `tag` and `tags` are mutually exclusive."
      tags: [Media]
      operationId: listMedia
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search over title and extracted text.
        - in: query
          name: search
          schema:
            type: string
          description: Alias for `q`. `q` wins when both are sent.
        - in: query
          name: tag
          schema:
            type: string
          description: Single tag filter. Mutually exclusive with `tags`.
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tags; an item must carry all of them. Mutually exclusive with `tag`.
          example: "invoice,2026"
        - in: query
          name: excludeTags
          schema:
            type: string
          description: Comma-separated tags to exclude.
        - in: query
          name: thumbState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: textState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: mimeType
          schema:
            type: string
          description: MIME type prefix match (e.g. `image/`).
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/MediaSortOption"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - in: query
          name: cursor
          schema:
            type: string
          description: Media ID of the last item on the previous page.
        - in: query
          name: excludeUnpacked
          schema:
            type: boolean
          description: Hide items that were extracted from an archive.
        - in: query
          name: missing
          schema:
            type: string
            enum: [only]
          description: "`only` restricts the list to items whose source file has vanished."
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      summary: Bulk delete media
      description: |
        Enqueues a background delete; poll `/api/media/delete/status`. Send `{ ids }`
        for hand-picked items, or use the query filters.

        **An empty filter with no body deletes every item the user owns.**
      tags: [Media]
      operationId: bulkDeleteMedia
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tags.
        - in: query
          name: excludeTags
          schema:
            type: string
        - in: query
          name: thumbState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: textState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: excludeUnpacked
          schema:
            type: boolean
        - in: query
          name: missing
          schema:
            type: string
            enum: [only]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteRequest"
      responses:
        "202":
          description: Delete job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobIdResponse"
              examples:
                success:
                  value:
                    jobId: "delete-9f1c8a2e-1717000000000"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/stats:
    get:
      summary: Library totals and type breakdown
      description: Backs the overview header. `typeBreakdown` is the top 20 MIME types by count.
      tags: [Media]
      operationId: getMediaStats
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/storage:
    get:
      summary: Per-file sizes for the storage treemap
      description: "Returns the largest files exactly, plus a byte-weighted sample of the long tail. Sampled tiles carry `sampled: true`."
      tags: [Media]
      operationId: getMediaStorage
      parameters:
        - in: query
          name: top
          schema:
            type: integer
            minimum: 1
            maximum: 2000
          description: How many largest files to return exactly.
        - in: query
          name: sample
          schema:
            type: integer
            minimum: 0
            maximum: 2000
          description: How many representative tail tiles to sample.
      responses:
        "200":
          description: Treemap tiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaStorageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/storage/categories:
    get:
      summary: Storage totals per file-type bucket
      tags: [Media]
      operationId: getMediaStorageCategories
      responses:
        "200":
          description: Per-category counts and bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCategoryBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/text/scanned/count:
    get:
      summary: Size of the deferred-OCR backlog
      description: "Items at `textState: NEEDS_OCR`. Drained by `POST /api/media/batch/text/scanned`."
      tags: [Media]
      operationId: countScannedAwaitingOcr
      responses:
        "200":
          description: Backlog size
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/duplicates:
    get:
      summary: List byte-identical duplicate groups
      description: Groups share a SHA-256 `contentHash`. A non-zero `unhashedCount` means the list is incomplete.
      tags: [Duplicates]
      operationId: listDuplicates
      responses:
        "200":
          description: Duplicate groups, largest reclaimable space first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateGroupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/duplicates/scan:
    post:
      summary: Backfill missing content hashes
      description: Marks every READY item without a `contentHash` for hashing. Returns how many rows were reset.
      tags: [Duplicates]
      operationId: startDuplicateScan
      responses:
        "200":
          description: Rows queued for hashing
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: integer
                required:
                  - ok
                  - queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/media/events:
    get:
      summary: Server-Sent Events stream of media state changes
      description: "Emits per-item state flips plus `mediaCreated`/`mediaDeleted`. Sends a `: ping` comment every 25 s."
      tags: [Media]
      operationId: mediaEvents
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                update:
                  summary: One event frame
                  value: |
                    data: {"mediaId":"3f2a...","field":"thumbState","value":"READY"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/bulk-download:
    post:
      summary: Download several items as a zip
      description: Streams `application/zip`. In-place sources are re-validated against the allow-list as they are read.
      tags: [Media]
      operationId: bulkDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDownloadRequest"
      responses:
        "200":
          description: Zip archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/unpack-new:
    post:
      summary: Auto-unpack archives that just entered the library
      description: "`count` is how many IDs were submitted; `queued` is how many unpack jobs exist afterwards. Omitting `autoUnpack` falls back to the `autoUnpackArchives` preference."
      tags: [Media]
      operationId: unpackNewMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnpackNewRequest"
      responses:
        "200":
          description: Unpack result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  queued:
                    type: integer
                required:
                  - ok
                  - count
                  - queued
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Batch derivative operations -------------------------------------------
  # "batch" is a literal path segment, kept distinct from /{id}/* so Fastify
  # cannot parse it as a media ID.

  /api/media/batch/thumbnail:
    post:
      summary: Re-generate thumbnails for many items
      tags: [Media]
      operationId: batchRegenerateThumbnails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaIdBatchRequest"
      responses:
        "200":
          description: Queue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchQueueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/batch/text:
    post:
      summary: Re-run text extraction for many items
      description: Tier 1 only — native extraction. Never shells out to Tesseract.
      tags: [Media]
      operationId: batchExtractText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaIdBatchRequest"
      responses:
        "200":
          description: Queue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchQueueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/batch/text/scanned:
    post:
      summary: Drain the deferred-OCR backlog
      description: Queues tier-2 OCR for items at `NEEDS_OCR`. Bounded; `remaining` reports what is left.
      tags: [Media]
      operationId: extractAllScannedText
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  description: Maximum jobs to queue in this call. Capped server-side.
      responses:
        "200":
          description: Queue result
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: integer
                  remaining:
                    type: integer
                    description: Items still at NEEDS_OCR after this call.
                required:
                  - queued
                  - remaining
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/batch/thumbnail/prioritize:
    post:
      summary: Promote thumbnails for on-screen items
      description: Moves already-pending work to the front of the queue; generates nothing. Both counts are `0` when `DERIVATIVE_FEED_ENABLED=false`.
      tags: [Media]
      operationId: prioritizeThumbnails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaIdBatchRequest"
      responses:
        "200":
          description: Promotion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/batch/text/prioritize:
    post:
      summary: Promote text extraction for specific items
      description: Tier 1 only. Forced OCR is `POST /api/media/{id}/text` with `forceOcr`.
      tags: [Media]
      operationId: prioritizeText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaIdBatchRequest"
      responses:
        "200":
          description: Promotion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- In-place indexing -----------------------------------------------------

  /api/media/index/roots:
    get:
      summary: Configured indexing roots
      description: An empty `roots` array means in-place indexing is disabled.
      tags: [Indexing]
      operationId: getIndexRoots
      responses:
        "200":
          description: Allowed roots
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  roots:
                    type: array
                    items:
                      type: string
                required:
                  - enabled
                  - roots
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/index:
    post:
      summary: Scan a server-side folder and index its files in place
      description: Adds files not already indexed; `POST /api/media/index/reconcile` picks up deletions, moves and edits. The path must sit under `indexAllowedRoots`. Poll `/api/media/index/status`.
      tags: [Indexing]
      operationId: startIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIndexRequest"
      responses:
        "200":
          description: Scan enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobIdResponse"
        "400":
          description: Indexing disabled, or the path is not a directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path is outside every allowed root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A scan is already running for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/media/index/status:
    get:
      summary: Poll scan progress
      tags: [Indexing]
      operationId: getIndexStatus
      parameters:
        - in: query
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/index/active:
    get:
      summary: The user's in-flight scan
      description: Lets the UI re-attach after a reload. `status` is null when nothing is running.
      tags: [Indexing]
      operationId: getActiveIndex
      responses:
        "200":
          description: Active scan, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    anyOf:
                      - $ref: "#/components/schemas/IndexStatus"
                      - type: "null"
                required:
                  - status
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/index/reconcile:
    post:
      summary: Reconcile the allowed folders against the library
      description: Picks up deletions, moves and edits. A missing file is tombstoned (`missingSince`) rather than deleted. `path` narrows the sweep to one root; omitting it reconciles all, returning one job ID per root.
      tags: [Indexing]
      operationId: startReconcile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Reconcile enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobIds:
                    type: array
                    items:
                      type: string
                required:
                  - jobIds
        "400":
          description: In-place indexing is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path is outside every allowed root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/media/index/reconcile/state:
    get:
      summary: Running and most recent reconcile sweeps
      description: One round-trip for live progress (`active`) and the last finished summary (`last`).
      tags: [Indexing]
      operationId: getReconcileState
      responses:
        "200":
          description: Reconcile state
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    anyOf:
                      - $ref: "#/components/schemas/ReconcileStatus"
                      - type: "null"
                  last:
                    anyOf:
                      - $ref: "#/components/schemas/ReconcileStatus"
                      - type: "null"
                required:
                  - active
                  - last
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Bulk delete jobs ------------------------------------------------------

  /api/media/delete/status:
    get:
      summary: Poll bulk-delete progress
      tags: [Media]
      operationId: getDeleteStatus
      parameters:
        - in: query
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/delete/active:
    get:
      summary: The user's in-flight bulk delete
      tags: [Media]
      operationId: getActiveDelete
      responses:
        "200":
          description: Active delete job, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    anyOf:
                      - $ref: "#/components/schemas/DeleteStatus"
                      - type: "null"
                required:
                  - status
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/media/delete/abort:
    post:
      summary: Stop in-flight bulk deletes
      description: Already-deleted items are not restored. `epoch` is null when Redis is unavailable.
      tags: [Media]
      operationId: abortDelete
      responses:
        "200":
          description: Abort signalled
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch:
                    type: [integer, "null"]
                required:
                  - epoch
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Single item -----------------------------------------------------------

  /api/media/{id}:
    get:
      summary: Get media detail
      description: Opening an item whose `thumbState` is `PENDING` also promotes its thumbnail.
      tags: [Media]
      operationId: getMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Media detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update media title or tags
      description: Tags are normalized (lowercased, trimmed, deduplicated). Sending `tags` replaces the whole list.
      tags: [Media]
      operationId: updateMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdateRequest"
      responses:
        "200":
          description: Updated media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete one media item
      description: Removes the row and any derivatives it owns. An in-place source file is never deleted; a managed original is removed from storage.
      tags: [Media]
      operationId: deleteMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/star:
    post:
      summary: Toggle starred
      tags: [Media]
      operationId: toggleMediaStar
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: New starred state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  starred:
                    type: boolean
                required:
                  - ok
                  - starred
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/reveal:
    post:
      summary: Reveal the file in the host's file manager
      description: Gated on `LOCAL_EXPLORER`. In-place sources are re-validated against the allow-list.
      tags: [Media]
      operationId: revealMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: File manager launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Reveal is disabled, or the path left the allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/download:
    get:
      summary: Get a download URL for the original
      description: Returns a URL, not bytes. In-place originals resolve to `/api/media/{id}/source`, managed originals to a presigned storage URL.
      tags: [Media]
      operationId: getMediaDownloadUrl
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDownloadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/source:
    get:
      summary: Stream an in-place original from disk
      description: In-place originals only; managed items use the presigned `/download` URL. Supports single-range requests.
      tags: [Media]
      operationId: getMediaSource
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - in: header
          name: Range
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Full file
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string

  /api/media/{id}/thumbnail:
    get:
      summary: Stream the thumbnail
      description: Returns a 1×1 WebP placeholder when the thumbnail is missing or the ID is not a valid UUID. Immutable-cached.
      tags: [Media]
      operationId: getMediaThumbnail
      security: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: WebP thumbnail, or the placeholder
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary

  /api/media/{id}/text:
    get:
      summary: Get a chunk of extracted text
      tags: [Media]
      operationId: getMediaText
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 4000
      responses:
        "200":
          description: Text chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTextChunk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Re-run text extraction
      description: "`forceOcr: true` routes to tier-2 OCR (Tesseract); otherwise tier-1 native extraction. Returns once queued."
      tags: [Media]
      operationId: extractMediaText
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextExtractionRequest"
      responses:
        "200":
          description: Queued, or a no-op marking the item `UNSUPPORTED` when the MIME type cannot carry text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/text/cancel:
    post:
      summary: Cancel text extraction
      description: "Removes the job from both text tiers and leaves the item at `textState: ERROR`."
      tags: [Media]
      operationId: cancelMediaText
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/text/queue-position:
    get:
      summary: Where this item sits in the tier-1 text backlog
      description: 404 when the item has no position — dispatched, finished, or ineligible. `total` spans all users.
      tags: [Media]
      operationId: getTextQueuePosition
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Backlog position
          content:
            application/json:
              schema:
                type: object
                properties:
                  position:
                    type: integer
                    description: 1-based position in the backlog.
                  total:
                    type: integer
                required:
                  - position
                  - total
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/thumbnail/regenerate:
    post:
      summary: Force a fresh thumbnail render
      description: Bypasses sibling-row reuse. `queued` is false when the MIME type cannot be rendered, which marks the item `UNSUPPORTED`.
      tags: [Media]
      operationId: regenerateMediaThumbnail
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Regeneration queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: boolean
                required:
                  - ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media/{id}/unpack:
    post:
      summary: Extract an archive into a bundle
      tags: [Media]
      operationId: unpackMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Unpack queued, with the bundle it will fill
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundleId:
                    type: string
                required:
                  - bundleId
        "400":
          description: Not a recognised archive type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Archive is already linked to a bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  # ---------------------------------------------------------------------------
  # Tags
  # ---------------------------------------------------------------------------
  /api/tags:
    get:
      summary: List top tags for the current user
      tags:
        - Tags
      operationId: tags_list
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
              examples:
                success:
                  value:
                    tags:
                      - name: "receipt"
                        count: 12
                      - name: "application-pdf"
                        count: 9
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/tags/orphaned:
    delete:
      summary: Delete all orphaned tags
      description: Deletes tags that are not referenced by any media for the current user.
      tags:
        - Tags
      operationId: tags_deleteOrphaned
      responses:
        "200":
          description: Orphaned tags deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: integer
                required:
                  - ok
                  - deleted
              examples:
                success:
                  value:
                    ok: true
                    deleted: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/tags/{tag}:
    patch:
      summary: Rename or recolor a tag
      tags:
        - Tags
      operationId: tags_update
      parameters:
        - in: path
          name: tag
          required: true
          schema:
            type: string
          description: Tag name (will be normalized before update).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatchRequest"
            examples:
              rename:
                value:
                  name: "receipts"
              recolor:
                value:
                  color: "#ff5733"
              clearColor:
                value:
                  color: null
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPatchResponse"
              examples:
                renamed:
                  value:
                    ok: true
                    tag: "receipt"
                    newName: "receipts"
                    affected: 12
                recolored:
                  value:
                    ok: true
                    tag: "receipt"
        "400":
          description: Invalid tag name or no fields to update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a tag and remove it from all media
      tags:
        - Tags
      operationId: tags_delete
      parameters:
        - in: path
          name: tag
          required: true
          schema:
            type: string
          description: Tag name (will be normalized before deletion).
      responses:
        "200":
          description: Tag deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDeleteResponse"
              examples:
                success:
                  value:
                    ok: true
                    tag: "receipt"
        "400":
          description: Invalid tag name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Tags may only contain lowercase letters, digits, and dashes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Bundles
  # ---------------------------------------------------------------------------
  /api/bundles:
    get:
      summary: List bundles for the current user
      tags:
        - Bundles
      operationId: bundles_list
      responses:
        "200":
          description: Bundle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleListResponse"
              examples:
                success:
                  value:
                    bundles:
                      - id: "c1d2e3f4-0001-0000-0000-000000000001"
                        name: "Tax documents 2025"
                        description: "W2, receipts, and filings"
                        starred: true
                        itemCount: 7
                        coverMediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                        createdAt: "2026-01-01T00:00:00Z"
                        updatedAt: "2026-03-15T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a bundle
      tags:
        - Bundles
      operationId: bundles_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleCreateRequest"
            examples:
              create:
                value:
                  name: "Tax documents 2025"
                  description: "W2, receipts, and filings"
      responses:
        "201":
          description: Bundle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleSummaryResponse"
              examples:
                success:
                  value:
                    bundle:
                      id: "c1d2e3f4-0001-0000-0000-000000000001"
                      name: "Tax documents 2025"
                      description: "W2, receipts, and filings"
                      starred: false
                      itemCount: 0
                      coverMediaId: null
                      createdAt: "2026-03-17T00:00:00Z"
                      updatedAt: "2026-03-17T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/bundles/{id}:
    get:
      summary: Get bundle detail with items
      tags:
        - Bundles
      operationId: bundles_get
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Bundle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleDetailResponse"
              examples:
                success:
                  value:
                    bundle:
                      id: "c1d2e3f4-0001-0000-0000-000000000001"
                      name: "Tax documents 2025"
                      description: "W2, receipts, and filings"
                      starred: true
                      itemCount: 2
                      coverMediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      createdAt: "2026-01-01T00:00:00Z"
                      updatedAt: "2026-03-15T12:00:00Z"
                      items:
                        - mediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                          order: 0
                          addedAt: "2026-01-01T00:00:00Z"
                          title: "W2 2025"
                          mimeType: "application/pdf"
                          thumbState: "READY"
                          thumbnailKey: "usr_123/7a1b54a0/thumb.webp"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update bundle name or description
      tags:
        - Bundles
      operationId: bundles_update
      parameters:
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundlePatchRequest"
            examples:
              update:
                value:
                  name: "Tax docs 2025 (updated)"
      responses:
        "200":
          description: Bundle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a bundle
      description: Deletes the bundle record. Media items are not deleted.
      tags:
        - Bundles
      operationId: bundles_delete
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "204":
          description: Bundle deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/bundles/{id}/items:
    post:
      summary: Add media items to a bundle
      tags:
        - Bundles
      operationId: bundles_addItems
      parameters:
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleAddItemsRequest"
            examples:
              add:
                value:
                  mediaIds:
                    - "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    - "8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da"
      responses:
        "200":
          description: Items added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/bundles/{id}/items/{mediaId}:
    delete:
      summary: Remove a media item from a bundle
      tags:
        - Bundles
      operationId: bundles_removeItem
      parameters:
        - $ref: "#/components/parameters/BundleId"
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/bundles/{id}/items/order:
    put:
      summary: Reorder items within a bundle
      tags:
        - Bundles
      operationId: bundles_reorderItems
      parameters:
        - $ref: "#/components/parameters/BundleId"
      requestBody:
