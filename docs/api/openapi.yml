openapi: 3.1.0
info:
  title: Vault API
  version: 0.1.0
  description: |
    Vault HTTP JSON API.

    Conventions:
    - JSON request/response bodies use `application/json` unless otherwise noted.
    - Error responses use the `ErrorResponse` schema.
    - Pagination: list endpoints use `limit` with cursor-based pagination via `cursor`/`nextCursor`. The media list also supports page-based pagination via `page`/`nextPage` when `cursor` is omitted. Max `limit` for media list is 100.
    - IDs are strings; media IDs are validated as UUIDs in path parameters.
    - Timestamps are RFC3339 `date-time` strings.
    - Auth: `requireAuth` prefers `Authorization: Bearer <token>` and falls back to the `access_token` cookie. `/api/auth/me` is cookie-only.
    - Query array params use `style: form` with `explode: true` (e.g., `tags=one&tags=two`).
servers:
  - url: http://127.0.0.1:8000
    description: Local dev
tags:
  - name: Auth
  - name: Profile
  - name: Media
  - name: Tags
  - name: Bundles
  - name: Reminders
  - name: Preferences
  - name: Server
  - name: Init
  - name: Health
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/auth/me:
    get:
      summary: Get the current user
      description: Reads the `access_token` cookie.
      tags:
        - Auth
      operationId: auth_me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      avatarUrl: "https://cdn.example.com/avatar.png"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      operationId: auth_register
      security: []
      x-rateLimit:
        max: 5
        timeWindow: "1 minute"
        keyBy: IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
            examples:
              register:
                value:
                  email: "user@example.com"
                  password: "correct-horse-battery"
      responses:
        "200":
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access"
                    refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "User already exists"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      summary: Log in and set auth cookies
      description: |
        Sets `access_token` (20 h) and `refresh_token` (7 d) httpOnly cookies.
        Rate limited to 30 attempts/min per IP and 10 attempts/min per email.
      tags:
        - Auth
      operationId: auth_login
      security: []
      x-rateLimit:
        - max: 30
          timeWindow: "1 minute"
          keyBy: IP
        - max: 10
          timeWindow: "1 minute"
          keyBy: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            examples:
              login:
                value:
                  email: "user@example.com"
                  password: "correct-horse-battery"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Invalid email or password format"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: "Unauthorized"
                    message: "Invalid credentials"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/refresh:
    post:
      summary: Refresh the access token
      description: |
        Issues a new access token from a valid refresh token. The refresh token's
        tokenVersion must still match the user's current tokenVersion; a password
        reset bumps tokenVersion, so refresh tokens issued before the reset are
        rejected with 401.
      tags:
        - Auth
      operationId: auth_refresh
      security: []
      x-rateLimit:
        max: 60
        timeWindow: "1 minute"
        keyBy: IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
            examples:
              refresh:
                value:
                  refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh"
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
              examples:
                success:
                  value:
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: "Unauthorized"
                    message: "Invalid or expired refresh token"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/logout:
    post:
      summary: Log out (clear auth cookies)
      description: |
        Clears the access_token and refresh_token cookies. Stateless JWTs cannot be
        revoked server-side, so the tokens themselves stay valid until they expire
        (or are evicted when the user's tokenVersion changes).

        There is no self-service password reset: password recovery is admin-only via
        the reset-password CLI (`pnpm reset-password --email <addr>`), which sets the
        password directly and bumps tokenVersion so prior sessions can no longer refresh.
      tags:
        - Auth
      operationId: auth_logout
      responses:
        "200":
          description: Cookies cleared
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  value: {}
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Profile
  # ---------------------------------------------------------------------------
  /api/profile:
    get:
      summary: Get the current user's profile
      tags:
        - Profile
      operationId: profile_get
      responses:
        "200":
          description: Profile payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              examples:
                success:
                  value:
                    profile:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      bio: "Scanning everything."
                      website: "https://example.com"
                      location: "Seattle, WA"
                      avatarUrl: "https://cdn.example.com/avatar.png"
                      createdAt: "2026-01-29T18:35:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update the current user's profile
      tags:
        - Profile
      operationId: profile_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatchRequest"
            examples:
              update:
                value:
                  name: "Casey"
                  bio: "Scanning everything."
                  location: "Seattle, WA"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              examples:
                success:
                  value:
                    profile:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      bio: "Scanning everything."
                      website: null
                      location: "Seattle, WA"
                      avatarUrl: null
                      createdAt: "2026-01-29T18:35:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Media
  # ---------------------------------------------------------------------------
  /api/media:
    post:
      summary: Initialize a media upload
      description: Returns a presigned S3 PUT URL. Upload the file directly to that URL, then call `/finalize`.
      tags:
        - Media
      operationId: media_initUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInitUploadRequest"
            examples:
              init:
                value:
                  filename: "receipt.pdf"
                  mimeType: "application/pdf"
                  sizeBytes: 24576
                  title: "January receipt"
                  tags:
                    - "receipt"
                    - "2026"
      responses:
        "200":
          description: Upload initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInitUploadResponse"
              examples:
                success:
                  value:
                    id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    uploadUrl: "https://s3.example.com/presigned-put"
                    storageKey: "usr_123/7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9/receipt.pdf"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "receipt.pdf exceeds the documents limit (250 MB max)."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: List media for the current user
      description: If `cursor` is provided, `page` is ignored.
      tags:
        - Media
      operationId: media_list
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search text (alias of `search`).
        - in: query
          name: search
          schema:
            type: string
          description: Search text (alias of `q`).
        - in: query
          name: tag
          schema:
            type: string
          description: Single tag filter. Mutually exclusive with `tags`.
        - in: query
          name: tags
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Multiple tag filters. Mutually exclusive with `tag`.
        - in: query
          name: thumbState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: textState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/MediaSortOption"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number when not using cursor pagination.
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
              examples:
                cursorMode:
                  value:
                    items:
                      - id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                        title: "January receipt"
                        thumbState: "READY"
                        textState: "READY"
                        createdAt: "2026-01-29T18:35:00Z"
                        tags:
                          - "receipt"
                          - "application-pdf"
                        mimeType: "application/pdf"
                    nextCursor: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    nextPage: null
                pageMode:
                  value:
                    items:
                      - id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                        title: "January receipt"
                        thumbState: "READY"
                        textState: "READY"
                        createdAt: "2026-01-29T18:35:00Z"
                        tags:
                          - "receipt"
                          - "application-pdf"
                        mimeType: "application/pdf"
                    nextCursor: null
                    nextPage: 2
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  $ref: "#/components/examples/ErrorBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Bulk delete media matching filter params
      description: |
        Deletes all media items matching the given filters for the current user.
        If no filters are provided, all media is deleted.
      tags:
        - Media
      operationId: media_bulkDelete
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search text filter.
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tag filters.
        - in: query
          name: excludeTags
          schema:
            type: string
          description: Comma-separated tags to exclude.
        - in: query
          name: thumbState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: textState
          schema:
            $ref: "#/components/schemas/MediaWorkerState"
        - in: query
          name: excludeUnpacked
          schema:
            type: boolean
          description: Exclude items that were extracted from an archive.
      responses:
        "200":
          description: Bulk delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResponse"
              examples:
                success:
                  value:
                    count: 42
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/batch-init:
    post:
      summary: Initialize multiple uploads in a batch
      tags:
        - Media
      operationId: media_batchInit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaBatchInitRequest"
            examples:
              init:
                value:
                  items:
                    - filename: "receipt.pdf"
                      mimeType: "application/pdf"
                      sizeBytes: 24576
                      title: "January receipt"
                      tags: "receipt,2026"
                    - filename: "scan.png"
                      mimeType: "image/png"
                      sizeBytes: 10240
      responses:
        "200":
          description: Batch initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaBatchInitResponse"
              examples:
                success:
                  value:
                    items:
                      - id: "8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da"
                        storageKey: "usr_123/8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da/receipt.pdf"
                        putUrl: "https://s3.example.com/presigned-put-1"
                      - id: "b5d3adbb-2bd5-4b22-9412-7d1c54a89b7b"
                        storageKey: "usr_123/b5d3adbb-2bd5-4b22-9412-7d1c54a89b7b/scan.png"
                        putUrl: "https://s3.example.com/presigned-put-2"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/batch-finalize:
    post:
      summary: Finalize multiple uploads
      tags:
        - Media
      operationId: media_batchFinalize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaBatchFinalizeRequest"
            examples:
              finalize:
                value:
                  ids:
                    - "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    - "8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da"
      responses:
        "200":
          description: Batch finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFinalizeResponse"
              examples:
                success:
                  value:
                    ok: true
                    count: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/bulk-download:
    post:
      summary: Download multiple media items as a zip
      description: Streams the selected media items as a single zip archive (max 50 items).
      tags:
        - Media
      operationId: media_bulkDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDownloadRequest"
            examples:
              download:
                value:
                  ids:
                    - "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                    - "8f0c1c5c-1c60-4c06-9e3d-7d0bfae7a4da"
      responses:
        "200":
          description: Zip archive stream
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="vault-download.zip"'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/tags:
    get:
      summary: List top tags for the current user
      tags:
        - Media
      operationId: media_listTags
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of tags to return.
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
              examples:
                success:
                  value:
                    tags:
                      - name: "receipt"
                        count: 12
                      - name: "application-pdf"
                        count: 9
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/events:
    get:
      summary: Subscribe to real-time media processing updates
      description: |
        Server-Sent Events (SSE) stream. Each event carries the updated field and value
        for a media item owned by the authenticated user. A keep-alive ping comment is
        sent every 25 seconds.

        Event format:
        ```
        data: {"mediaId":"<uuid>","field":"<field>","value":"<value>"}
        ```
      tags:
        - Media
      operationId: media_events
      responses:
        "200":
          description: SSE stream established
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                update:
                  value: "data: {\"mediaId\":\"7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9\",\"field\":\"thumbState\",\"value\":\"READY\"}"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/media/{id}/finalize:
    post:
      summary: Finalize a single upload
      tags:
        - Media
      operationId: media_finalize
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFinalizeResponse"
              examples:
                success:
                  value:
                    ok: true
                    count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/{id}:
    get:
      summary: Get media detail
      tags:
        - Media
      operationId: media_getDetail
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Media detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDetailResponse"
              examples:
                success:
                  value:
                    media:
                      id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      userId: "usr_123"
                      title: "January receipt"
                      filename: "receipt.pdf"
                      mimeType: "application/pdf"
                      sizeBytes: 24576
                      storageKey: "usr_123/7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9/receipt.pdf"
                      createdAt: "2026-01-29T18:35:00Z"
                      updatedAt: "2026-01-29T18:35:30Z"
                      tags:
                        - "receipt"
                        - "application-pdf"
                      thumbState: "READY"
                      thumbError: null
                      textState: "READY"
                      thumbnailKey: "usr_123/7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9/thumb.webp"
                      hasText: true
                      hasThumb: true
                      textError: null
                      textAttemptsMade: null
                      textAttemptsTotal: null
                    document:
                      rawText: "Lorem ipsum..."
                      textSource: "OCR"
                      textTotalLength: 1200
                      textLanguage: "English"
                      textLanguageStatus: "ok"
                    metadata:
                      text:
                        totalChars: 1200
                        totalWords: 220
                        pageCount: 1
                        pagesWithText: 1
                        avgCharsPerPage: 1200
                        avgWordsPerPage: 220
                      pdf:
                        pageCount: 1
                        encrypted: false
                    permissions:
                      canEdit: true
                      canDelete: true
                      canDownload: true
                      canOcr: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update media metadata
      tags:
        - Media
      operationId: media_update
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdateRequest"
            examples:
              update:
                value:
                  title: "January receipt (updated)"
                  tags:
                    - "receipt"
                    - "2026"
      responses:
        "200":
          description: Updated media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpdateResponse"
              examples:
                success:
                  value:
                    media:
                      id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      title: "January receipt (updated)"
                      filename: "receipt.pdf"
                      sizeBytes: 24576
                      mimeType: "application/pdf"
                      thumbState: "READY"
                      textState: "READY"
                      tags:
                        - "receipt"
                        - "2026"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequest:
                  value:
                    statusCode: 400
                    error: "Bad Request"
                    message: "Provide a title or tags to update"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
