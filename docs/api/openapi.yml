              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/media/{id}/unpack:
    post:
      summary: Unpack an archive into a bundle
      description: |
        Extracts the archive and creates a new bundle containing the extracted items.
        Returns `400` if the file is not a recognised archive type, or `409` if it is
        already linked to a bundle.
      tags:
        - Media
      operationId: media_unpack
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Archive unpacked, bundle created
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundleId:
                    type: string
                required:
                  - bundleId
              examples:
                success:
                  value:
                    bundleId: "c1d2e3f4-0001-0000-0000-000000000001"
        "400":
          description: File is not a recognised archive type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Archive is already linked to a bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          $ref: "#/components/responses/InternalServerError"
