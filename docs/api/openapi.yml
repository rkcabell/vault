  # ---------------------------------------------------------------------------
  # Reminders
  # ---------------------------------------------------------------------------
  /api/reminders/summary:
    get:
      summary: Get reminder counts by bucket
      tags:
        - Reminders
      operationId: reminders_summary
      responses:
        "200":
          description: Reminder summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSummaryStats"
              examples:
                success:
                  value:
                    visibleNow: 3
                    overdue: 1
                    dueToday: 1
                    dueSoon: 1
                    totalActive: 5
                    soonWindowDays: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders:
    get:
      summary: List reminders
      description: |
        - `status=active` (default) returns active reminders sorted by urgency.
        - `status=completed` returns completed reminders, only supports `view=all`.
        - `view=overview` (default) returns a limited set grouped by bucket; `view=all` returns a flat list.
      tags:
        - Reminders
      operationId: reminders_list
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - completed
          description: Filter by reminder status. Defaults to `active`.
        - in: query
          name: view
          schema:
            type: string
            enum:
              - overview
              - all
          description: "`overview` returns a capped list per bucket; `all` returns the full flat list. `completed` supports `view=all` only."
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
          description: Maximum items to return. Applies per-bucket in `overview` view.
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
              examples:
                active:
                  value:
                    items:
                      - id: "a1b2c3d4-0000-0000-0000-000000000001"
                        title: "Renew car insurance"
                        note: "Check inbox for renewal notice"
                        media:
                          id: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                          title: "Insurance policy"
                        effectiveDueAt: "2026-03-20T00:00:00Z"
                        remindAt: "2026-03-13T00:00:00Z"
                        snoozedUntil: null
                        bucket: "soon"
                        isOverdue: false
                        remindOffsetDays: 7
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a reminder
      tags:
        - Reminders
      operationId: reminders_create
      parameters:
        - in: header
          name: x-timezone
          schema:
            type: string
          description: IANA timezone identifier (e.g. `America/New_York`). Defaults to UTC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
            examples:
              simple:
                value:
                  title: "Renew car insurance"
                  dueAt: "2026-03-20T00:00:00Z"
                  remindOffsetDays: 7
                  mediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
              recurring:
                value:
                  title: "Monthly budget review"
                  dueAt: "2026-04-01T00:00:00Z"
                  rrule: "FREQ=MONTHLY;BYMONTHDAY=1"
      responses:
        "201":
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
              examples:
                success:
                  value:
                    reminder:
                      id: "a1b2c3d4-0000-0000-0000-000000000001"
                      userId: "usr_123"
                      title: "Renew car insurance"
                      note: null
                      mediaId: "7a1b54a0-5e98-4f1e-a3f5-2b2b3e9f08c9"
                      status: "ACTIVE"
                      timezone: "UTC"
                      dueAt: "2026-03-20T00:00:00Z"
                      nextDueAt: null
                      remindOffsetDays: 7
                      remindAt: "2026-03-13T00:00:00Z"
                      snoozedUntil: null
                      rrule: null
                      lastCompletedAt: null
                      createdAt: "2026-03-17T00:00:00Z"
                      updatedAt: "2026-03-17T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}:
    patch:
      summary: Update a reminder
      tags:
        - Reminders
      operationId: reminders_update
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchReminderRequest"
            examples:
              update:
                value:
                  title: "Renew car insurance (updated)"
                  remindOffsetDays: 14
      responses:
        "200":
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}/complete:
    post:
      summary: Mark a reminder complete
      description: One-off reminders become `COMPLETED`. Recurring reminders advance to the next occurrence, stay `ACTIVE`, and update `lastCompletedAt`.
      tags:
        - Reminders
      operationId: reminders_complete
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Reminder completed (or advanced to next recurrence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          description: Reminder is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}/snooze:
    post:
      summary: Snooze a reminder until a future time
      tags:
        - Reminders
      operationId: reminders_snooze
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnoozeReminderRequest"
            examples:
              snooze:
                value:
                  until: "2026-03-18T09:00:00Z"
      responses:
        "200":
          description: Reminder snoozed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          description: "`until` is in the past or reminder is not ACTIVE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/reminders/{id}/cancel:
    post:
      summary: Cancel a reminder
      tags:
        - Reminders
      operationId: reminders_cancel
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Reminder cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/reminders/{id}/unsnooze:
    post:
      summary: Clear a reminder's snooze
      tags:
        - Reminders
      operationId: reminders_unsnooze
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Snooze cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          description: Reminder is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Preferences
  # ---------------------------------------------------------------------------
  /api/preferences:
    get:
      summary: Get the current user's preferences
      tags:
        - Preferences
      operationId: preferences_get
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
              examples:
                success:
                  value:
                    preferences:
                      libraryViewMode: "grid"
                      libraryGridCols: 5
                      libraryIsCompactList: false
                      autoTagOnIngest: true
                      extractMetadata: true
                      detectDuplicates: false
                      lowMemoryMode: false
                      autoUnpackArchives: false
                      hideUnpackedItems: false
                      soonWindowDays: 7
                      themePreference: "system"
                      yellowHighlight: false
                      lightTheme: "default"
                      darkTheme: "new-moon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update the current user's preferences
      tags:
        - Preferences
      operationId: preferences_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesPatchRequest"
            examples:
              update:
                value:
                  libraryViewMode: "list"
                  themePreference: "dark"
                  darkTheme: "matrix"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Ingest — sending files over HTTP
  # ---------------------------------------------------------------------------
  /api/ingest/config:
    get:
      summary: Whether sending files is possible, and where they land
      description: "`reason` and `message` are present only when `enabled` is false."
      tags: [Ingest]
      operationId: getIngestConfig
      responses:
        "200":
          description: Ingest configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestConfigResponse"
              examples:
                enabled:
                  value:
                    enabled: true
                    folderPath: "D:/Vault/Inbox"
                    maxBytes: 2147483648
                notConfigured:
                  value:
                    enabled: false
                    folderPath: null
                    maxBytes: 2147483648
                    reason: "not-set"
                    message: "Choose the folder that sent files should be saved to."
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/ingest/file/{path}:
    put:
      summary: Send a file to Vault
      description: |
        The raw request body is the file; only the basename of the path is used.

        On a name collision the file is saved as e.g. `report (2).pdf` and returned
        as `savedAs` with `renamed: true`. The size limit is enforced against the
        bytes received, not the declared `Content-Length`.
      tags: [Ingest]
      operationId: ingestFile
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Percent-encoded filename. Only the basename is used.
          example: scan%20001.pdf
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: File written and indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
              examples:
                renamed:
                  value:
                    id: "8d1f0b6e-2c34-4a71-9f0d-5b7a2e9c1d33"
                    savedAs: "report (2).pdf"
                    renamed: true
                    sourcePath: "D:/Vault/Inbox/report (2).pdf"
                    sizeBytes: 384122
        "400":
          description: Missing or malformed filename, unsafe name, or over the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ingest is not configured — see `GET /api/ingest/config`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------------------
  # Tag Rules — the Tag Organizer
  # ---------------------------------------------------------------------------
  /api/tag-rules:
    get:
      summary: List tag rules
      tags: [Tag Rules]
      operationId: listTagRules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagRule"
                required:
                  - rules
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a tag rule
      description: "`matcher` must match the schema for its `source`, and `tagTemplate` must yield a valid tag once `{value}` is substituted."
      tags: [Tag Rules]
      operationId: createTagRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRuleCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/tag-rules/{id}:
    patch:
      summary: Update a tag rule
      description: "`source` and `matcher` are validated as a merged pair against the stored rule."
      tags: [Tag Rules]
      operationId: updateTagRule
      parameters:
        - $ref: "#/components/parameters/TagRuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRulePatchRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a tag rule
      tags: [Tag Rules]
      operationId: deleteTagRule
      parameters:
        - $ref: "#/components/parameters/TagRuleId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tag-rules/run:
    post:
      summary: Apply the rules to the whole library
      description: Applies the rules to every item, ignoring `autoTagOnIngest`. Poll `/api/tag-rules/run/status`.
      tags: [Tag Rules]
      operationId: runTagRules
      parameters:
        - in: query
          name: dryRun
          schema:
            type: string
            enum: ["true", "false"]
          description: "`true` previews the changes without writing them."
      responses:
        "200":
          description: Run enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/tag-rules/run/status:
    get:
      summary: Poll organize-run progress
      tags: [Tag Rules]
      operationId: getTagRuleRunStatus
      parameters:
        - in: query
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tag-rules/run/active:
    get:
      summary: The user's in-flight organize run
      tags: [Tag Rules]
      operationId: getActiveTagRuleRun
      responses:
        "200":
          description: Active run, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    anyOf:
                      - $ref: "#/components/schemas/OrganizeStatus"
                      - type: "null"
                required:
                  - status
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Jobs — queue depths and the stop controls
  # ---------------------------------------------------------------------------
  /api/jobs/queues:
    get:
      summary: Depths for every queue
      description: A queue that could not be read reports `null`. `derivativesPaused` is the runtime pause; `feederEnabled` is the `DERIVATIVE_FEED_ENABLED` deploy switch.
      tags: [Jobs]
      operationId: getQueueDepths
      responses:
        "200":
          description: Queue depths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDepthsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/jobs/cancel-scan:
    post:
      summary: Stop the directory walk and any queued sweeps
      description: Stops the index and reconcile sweeps and drains their queues; derivatives already found keep processing. Queues are global — on a multi-user install this affects everyone's jobs.
      tags: [Jobs]
      operationId: cancelScan
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobControlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/jobs/cancel-reconcile:
    post:
      summary: Stop only the reconcile sweep
      description: Leaves an index scan, if one is running, alone.
      tags: [Jobs]
      operationId: cancelReconcile
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobControlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/jobs/stop-all:
    post:
      summary: Cancel the scan and pause derivative work
      description: "`cancel-scan`, plus pausing the derivative feeder."
      tags: [Jobs]
      operationId: stopAllJobs
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JobControlResponse"
                  - type: object
                    properties:
                      derivativesPaused:
                        type: boolean
                    required:
                      - derivativesPaused
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/jobs/resume:
    post:
      summary: Clear the pause and start feeding again
      description: Kicks the feeder immediately rather than waiting out its idle interval.
      tags: [Jobs]
      operationId: resumeJobs
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  derivativesPaused:
                    type: boolean
                required:
                  - ok
                  - derivativesPaused
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/jobs/failed/clear:
    post:
      summary: Drain dead BullMQ records
      description: Clears failed BullMQ records. Omitting `queue` clears every queue.
      tags: [Jobs]
      operationId: clearFailedJobs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                queue:
                  type: string
                  description: Queue name. Omit to clear all.
                  enum: [index, reconcile, thumb, text, ocr, hash, unpack, organize, delete]
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  cleared:
                    type: object
                    additionalProperties:
                      type: integer
                required:
                  - ok
                  - cleared
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------------------
  # Sidecars — metadata snapshots
  # ---------------------------------------------------------------------------
  /api/sidecars:
    get:
      summary: Snapshot status
      description: "Answers with `enabled: false` when `SIDECAR_EXPORT_ENABLED=false`."
      tags: [Sidecars]
      operationId: getSidecarStatus
      responses:
        "200":
          description: Snapshot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidecarStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sidecars/export:
    post:
      summary: Write a snapshot now
      description: Skips the change probe rather than waiting for the export interval.
      tags: [Sidecars]
      operationId: exportSidecar
      responses:
        "200":
          description: Snapshot written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidecarExportResult"
        "400":
          description: "Snapshots are turned off for this account (`sidecarMode: off`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/SidecarDisabled"

  /api/sidecars/restore:
    post:
      summary: Reattach the snapshot to the current library
      description: |
        Additive: fills gaps only, never overwrites or deletes, so a second restore
        reports `updated: 0`. Matched on `sourcePath`, falling back to
        `contentHash`; a hash matching more than one row matches nothing.

        Poll `GET /api/sidecars` for progress and the result.
      tags: [Sidecars]
      operationId: restoreSidecar
      responses:
        "200":
          description: Restore started
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: boolean
                required:
                  - started
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: There is no snapshot to restore from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A restore is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SidecarDisabled"

  # ---------------------------------------------------------------------------
  # Storage proxy
  # ---------------------------------------------------------------------------
  /api/storage/blob/{key}:
    get:
      summary: Download a stored object
      description: Keys are namespaced by owner (`{userId}/{mediaId}/{filename}`); a request may only touch keys under its own `userId/` prefix. Supports single-range requests.
      tags: [Storage]
      operationId: getBlob
      parameters:
        - $ref: "#/components/parameters/StorageKey"
        - in: header
          name: Range
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Object bytes
          headers:
            Accept-Ranges:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: private, max-age=3600
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid object key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Key belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string
    put:
      summary: Upload a stored object
      description: Streams the body straight to storage, unbuffered and with no size limit. The key must sit under the caller's own `userId/` prefix.
      tags: [Storage]
      operationId: putBlob
      parameters:
        - $ref: "#/components/parameters/StorageKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored
        "400":
          description: Invalid object key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Key belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------------------
  # Server
  # ---------------------------------------------------------------------------
  /api/server/status:
    get:
      summary: Get server runtime status
      tags:
        - Server
      operationId: server_status
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatusResponse"
              examples:
                success:
                  value:
                    env: "production"
                    apiPort: 8000
                    corsOrigin: "http://localhost"
                    uptimeSeconds: 3600
                    memoryMB: 128
                    storageDriver: "fs"
                    storagePath: "/var/lib/vault/storage"
                    localExplorer: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/server/storage:
    get:
      summary: Get storage usage statistics
      tags:
        - Server
      operationId: server_storage
      responses:
        "200":
          description: Storage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStorageResponse"
              examples:
                success:
                  value:
                    sizeBytes: 104857600
                    objectCount: 250
                    dbSizeBytes: 52428800
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/server/storage/test:
    post:
      summary: Round-trip a probe object against the storage backend
      description: Writes, reads back and deletes a probe object. Surfaces the OS error code (`EACCES`, `ENOSPC`, …) on failure.
      tags: [Server]
      operationId: testStorage
      responses:
        "200":
          description: Backend is reachable and writable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  driver:
                    type: string
                  durationMs:
                    type: integer
                required:
                  - ok
                  - driver
                  - durationMs
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Storage self-test failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  driver:
                    type: string
                  code:
                    type: [string, "null"]
                    description: OS error code, when the failure had one.
                  message:
                    type: string
                required:
                  - ok
                  - driver
                  - code
                  - message

  /api/server/storage-config:
    get:
      summary: Current storage configuration
      description: "`canApply` is false in production."
      tags: [Server]
      operationId: getStorageConfig
      responses:
        "200":
          description: Storage config
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver:
                    type: string
                    enum: [fs]
                  fsPath:
                    type: string
                  canApply:
                    type: boolean
                required:
                  - driver
                  - fsPath
                  - canApply
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Repoint the storage path
      description: Writes `STORAGE_FS_PATH` to the `.env` the API loaded; takes effect on the next start. Forbidden in production.
      tags: [Server]
      operationId: updateStorageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fsPath:
                  type: string
                  description: Absolute path.
              required:
                - fsPath
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  restartRequired:
                    type: boolean
                  driver:
                    type: string
                  envPath:
                    type: string
                required:
                  - ok
                  - restartRequired
                  - driver
                  - envPath
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disabled in production, or the env file is not writable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/server/index-config:
    get:
      summary: Current in-place indexing configuration
      description: "`skipInfo` reports what the `skipNonContent` filter matches."
      tags: [Server]
      operationId: getIndexConfig
      responses:
        "200":
          description: Index config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Save the indexing allow-list and filters
      description: |
        Takes effect immediately. Roots are canonicalized and deduplicated, and a
        root overlapping Vault's own storage folder is rejected.

        `blacklist`, `excludeFolders`, `skipNonContent` and `ingestFolderPath` are
        optional; omitting one keeps its stored value. Dropping the root that
        contained `ingestFolderPath` clears it and sets `ingestFolderCleared`.
      tags: [Server]
      operationId: updateIndexConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexConfigPatchRequest"
      responses:
        "200":
          description: Saved. Echoes back only the fields that were changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConfigPatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/server/fs/list:
    get:
      summary: Browse server-side directories
      description: Read-only, directories only. Defaults to the server user's home directory and walks up to the nearest readable ancestor; `redirected` is true when that happened.
      tags: [Server]
      operationId: listServerDirectories
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Directory to list. Defaults to the server user's home directory.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/server/fs/mkdir:
    post:
      summary: Create a directory
      description: Non-recursive — `parent` must exist. `name` may not contain path separators or reserved characters.
      tags: [Server]
      operationId: createServerDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent:
                  type: string
                  description: Absolute path of an existing directory.
                name:
                  type: string
              required:
                - parent
                - name
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                required:
                  - path
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Parent folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A folder with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/server/workers:
    get:
      summary: Get worker queue status
      tags:
        - Server
      operationId: server_workers
      responses:
        "200":
          description: Worker queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWorkersResponse"
              examples:
                success:
                  value:
                    text:
                      active: true
                      count: 1
                      counts:
                        waiting: 0
                        active: 1
                        delayed: 0
                        failed: 0
                    ocr:
                      active: true
                      count: 1
                      counts:
                        waiting: 1840
                        active: 1
                        delayed: 0
                        failed: 0
                    thumb:
                      active: true
                      count: 1
                      counts:
                        waiting: 2
                        active: 1
                        delayed: 0
                        failed: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/server/backlog:
    get:
      summary: Derivative backlog progress
      description: "`ratePerSec` is null until two samples exist; `etaSeconds` is null when the rate is null or nothing is pending."
      tags: [Server]
      operationId: getDerivativeBacklog
      responses:
        "200":
          description: Backlog progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivativeProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Init
  # ---------------------------------------------------------------------------
  /api/init:
    get:
      summary: Bootstrap initial app data
      description: "Bootstraps the app in one request: user, preferences, tags, bundles, reminder summary counts and the reminder overview."
      tags:
        - Init
      operationId: init_get
      responses:
        "200":
          description: Bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
              examples:
                success:
                  value:
                    user:
                      id: "usr_123"
                      email: "user@example.com"
                      name: "Casey"
                      username: "casey"
                      avatarUrl: null
                    preferences:
                      libraryViewMode: "grid"
                      themePreference: "system"
                    tags:
                      - name: "receipt"
                        count: 12
                        color: null
                    bundles:
                      - id: "c1d2e3f4-0001-0000-0000-000000000001"
                        name: "Tax documents 2025"
                        starred: true
                        itemCount: 7
                    remindersSummary:
                      visibleNow: 3
                      overdue: 1
                      dueToday: 1
                      dueSoon: 1
                      totalActive: 5
                      soonWindowDays: 7
                    overviewReminders:
                      items: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health/healthz:
    get:
      summary: Liveness check
      tags:
        - Health
      operationId: health_liveness
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
  /health/readyz:
    get:
      summary: Readiness check
      description: Performs a database connectivity check (`SELECT 1`).
      tags:
        - Health
      operationId: health_readiness
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required:
                  - ready
              examples:
                success:
                  value:
                    ready: true
        "500":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  # ---------------------------------------------------------------------------
  # Reusable parameters
  # ---------------------------------------------------------------------------
  parameters:
    MediaId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Media ID (UUID).
    BundleId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Bundle ID.
    ReminderId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Reminder ID (UUID).
    TagRuleId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Tag rule ID.
    StorageKey:
      in: path
      name: key
      required: true
      schema:
        type: string
      description: Object key, `{userId}/{mediaId}/{filename}`. Matched as a wildcard, so it may contain slashes.
      example: 9f1c8a2e/3f2a.../report.pdf

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badRequest:
              $ref: "#/components/examples/ErrorBadRequest"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              $ref: "#/components/examples/ErrorUnauthorized"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              $ref: "#/components/examples/ErrorNotFound"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimited:
              $ref: "#/components/examples/ErrorRateLimited"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            serverError:
              $ref: "#/components/examples/ErrorInternalServer"
    SidecarDisabled:
      description: Snapshot export is disabled server-wide (`SIDECAR_EXPORT_ENABLED=false`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    ErrorResponse:
      type: object
      description: Error response payload from Fastify and rate limiting.
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        limit:
          type: integer
        windowMs:
          type: integer

    OkResponse:
      type: object
      description: Generic acknowledgement response.
      properties:
        ok:
          type: boolean
      required:
        - ok

    # --- Auth ---
    User:
      type: object
      description: User summary returned by auth endpoints.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        username:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
      required:
        - id
        - email
    AuthRegisterRequest:
      type: object
      description: Registration credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthRegisterResponse:
      type: object
      description: User and tokens returned after registration.
      properties:
        user:
          $ref: "#/components/schemas/User"
        access:
          type: string
        refresh:
          type: string
      required:
        - user
        - access
        - refresh
    AuthLoginRequest:
      type: object
      description: Login credentials.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthLoginResponse:
      type: object
      description: User returned after login. Tokens are set as httpOnly cookies.
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    AuthRefreshRequest:
      type: object
      description: Fallback for non-browser clients; the `refresh_token` cookie takes precedence.
      properties:
        refresh:
          type: string
    AuthRefreshResponse:
      type: object
      description: Freshly minted token pair. Also set as httpOnly cookies.
      properties:
        ok:
          type: boolean
        access:
          type: string
        refresh:
          type: string
      required:
        - ok
        - access
        - refresh
    AuthMeResponse:
      type: object
      description: Current user response.
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    # --- Profile ---
    Profile:
      type: object
      description: Profile details for the current user.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        username:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        website:
          type: [string, "null"]
        location:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - username
        - bio
        - website
        - location
        - avatarUrl
        - createdAt
    ProfileResponse:
      type: object
      description: Profile response envelope.
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - profile
    ProfilePatchRequest:
      type: object
      description: Profile fields to update (all optional).
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 200
        username:
          type: [string, "null"]
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 1000
        website:
          type: [string, "null"]
          maxLength: 200
        location:
          type: [string, "null"]
          maxLength: 200
        avatarUrl:
          type: [string, "null"]
          maxLength: 400

    # --- Media shared ---
    MediaWorkerState:
      type: string
      description: Background processing state. `UNSUPPORTED` means no job is needed for this file type. `NEEDS_OCR` occurs on `textState` only.
      enum:
        - PENDING
        - READY
        - ERROR
        - FAILED
        - UNSUPPORTED
        - NEEDS_OCR
    MediaSortOption:
      type: string
      description: Sort options for media listing.
      enum:
        - createdAt_desc
        - createdAt_asc
        - title_asc
        - title_desc
        - size_desc
        - size_asc
        - mimeType_asc
        - starred_first
        - fileDate_desc
    TextSource:
      type: string
      description: Source of extracted text.
      enum:
        - OCR
        - NATIVE
        - UNKNOWN
    TextLanguageStatus:
      type: string
      description: Language detection status.
      enum:
        - ok
        - short
        - error
    TagInput:
      description: Tag list as a comma-separated string or array of strings.
      oneOf:
        - type: string
        - type: array
          items:
            type: string

    # --- Ingest ---
    IngestConfigResponse:
      type: object
      description: Whether files can be sent, and where they land.
      properties:
        enabled:
          type: boolean
        folderPath:
          type: [string, "null"]
          description: Absolute path files are written to. Null when unset.
        maxBytes:
          type: integer
          description: Hard size ceiling for one sent file.
        reason:
          type: string
          description: Present only when `enabled` is false.
          enum:
            - no-roots
            - not-set
            - outside-roots
            - missing
        message:
          type: string
          description: Present only when `enabled` is false. What the user has to do to fix it.
      required:
        - enabled
        - folderPath
        - maxBytes
    IngestResult:
      type: object
      description: The row a sent file produced.
      properties:
        id:
          type: string
          format: uuid
        savedAs:
          type: string
          description: Name on disk. Differs from the sent name when it collided.
        renamed:
          type: boolean
        sourcePath:
          type: string
        sizeBytes:
          type: integer
      required:
        - id
        - savedAs
        - renamed
        - sourcePath
        - sizeBytes

    # --- Media batch + job envelopes ---
    JobIdResponse:
      type: object
      description: Identifier for a job to poll.
      properties:
        jobId:
          type: string
      required:
        - jobId
    MediaIdBatchRequest:
      type: object
      description: A batch of media IDs (1–500).
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
      required:
        - ids
    BatchQueueResponse:
      type: object
      description: How a batch re-queue landed.
      properties:
        queued:
          type: integer
        missing:
          type: integer
          description: IDs that matched no item the caller owns.
      required:
        - queued
        - missing
    PromoteResponse:
      type: object
      description: "`queued` is backlog rows dispatched; `reordered` is IDs whose existing job was re-prioritized."
      properties:
        queued:
          type: integer
        reordered:
          type: integer
      required:
        - queued
        - reordered
    UnpackNewRequest:
      type: object
      description: Archives to unpack (1–100 IDs).
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
        autoUnpack:
          type: boolean
          description: Overrides the `autoUnpackArchives` preference for this call.
      required:
        - ids

    # --- Media list/detail ---
    MediaSummary:
      type: object
      description: Summary item returned by media list.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        filename:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        createdAt:
          type: string
          format: date-time
        fileDate:
          type: [string, "null"]
          format: date-time
          description: The file's own date, when one could be derived. Distinct from when Vault first saw it.
        tags:
          type: array
          items:
            type: string
        mimeType:
          type: string
        sizeBytes:
          type: [integer, "null"]
        starred:
          type: boolean
        missingSince:
          type: [string, "null"]
          format: date-time
          description: When the source file was found to have vanished; null while present.
      required:
        - id
        - title
        - filename
        - thumbState
        - textState
        - createdAt
        - tags
        - mimeType
    MediaListResponse:
      type: object
      description: "`totalCount` and `hasExtractedItems` are returned on the first page only."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaSummary"
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page. Null on the last page.
        totalCount:
          type: integer
          description: Total items matching the filters. First page only.
        hasExtractedItems:
          type: boolean
          description: Whether the library contains any archive-extracted items. First page only.
      required:
        - items
        - nextCursor
    MediaStatsResponse:
      type: object
      description: Library totals for the overview header.
      properties:
        totalDocs:
          type: integer
        storageBytes:
          type: integer
        typeBreakdown:
          type: array
          description: Top 20 MIME types by count.
          items:
            type: object
            properties:
              mimeType:
                type: string
              count:
                type: integer
            required:
              - mimeType
              - count
      required:
        - totalDocs
        - storageBytes
        - typeBreakdown
    MediaStorageItem:
      type: object
      description: One treemap tile.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        weightBytes:
          type: integer
          description: Drives tile area. Equals `sizeBytes` for exact tiles, inflated for sampled tiles.
        sampled:
          type: boolean
          description: True for representative tail-sample tiles, which are drawn distinctly.
        representsCount:
          type: integer
          description: How many real files a sampled tile stands in for. 1 for exact tiles.
      required:
        - id
        - title
        - filename
        - mimeType
        - sizeBytes
    MediaStorageResponse:
      type: object
      description: Storage treemap payload.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaStorageItem"
        totalFiles:
          type: integer
        totalBytes:
          type: integer
      required:
        - items
    StorageBucket:
      type: string
      description: File-type bucket used by the storage breakdown.
      enum:
        - pdf
        - image
        - document
        - spreadsheet
        - presentation
        - video
        - audio
        - archive
        - code
        - other
    MediaCategorySlice:
      type: object
      description: Totals for one file-type bucket.
      properties:
        bucket:
          $ref: "#/components/schemas/StorageBucket"
        count:
          type: integer
        bytes:
          type: integer
      required:
        - bucket
        - count
        - bytes
    MediaCategoryBreakdown:
      type: object
      description: Per-bucket storage totals for the overview graph.
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MediaCategorySlice"
        totalFiles:
          type: integer
        totalBytes:
          type: integer
      required:
        - categories
        - totalFiles
        - totalBytes
    DuplicateItem:
      type: object
      description: One member of a duplicate group.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: [integer, "null"]
        sourcePath:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        thumbnailKey:
          type: [string, "null"]
      required:
        - id
        - filename
        - mimeType
        - createdAt
        - thumbState
    DuplicateGroup:
      type: object
      description: Items sharing one SHA-256 content hash.
      properties:
        contentHash:
          type: string
        sizeBytes:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateItem"
      required:
        - contentHash
        - sizeBytes
        - items
    DuplicateGroupsResponse:
      type: object
      description: Duplicate groups, ordered by reclaimable space (size × extra copies).
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"
        unhashedCount:
          type: integer
          description: READY items still without a hash. Non-zero means the list is incomplete.
      required:
        - groups
        - unhashedCount

    # --- Indexing and background jobs ---
    StartIndexRequest:
      type: object
      description: Folder to scan. Must sit under an allowed indexing root.
      properties:
        path:
          type: string
          minLength: 1
        recursive:
          type: boolean
          default: true
      required:
        - path
    IndexStatus:
      type: object
      description: Progress of one index scan.
      properties:
        jobId:
          type: string
        state:
          type: string
          description: BullMQ job state.
        done:
          type: boolean
        aborted:
          type: boolean
        scanned:
          type: integer
        indexed:
          type: integer
          description: Rows created. Lower than `scanned` when files were already known.
        skipped:
          type: integer
        filtered:
          type: integer
          description: Files excluded by the blacklist, hidden-file or non-content filters.
      required:
        - jobId
        - state
        - done
        - aborted
        - scanned
        - indexed
        - skipped
        - filtered
    ReconcileStatus:
      type: object
      description: Progress of one reconcile sweep over a single root.
      properties:
        jobId:
          type: string
        rootPath:
          type: string
        state:
          type: string
        done:
          type: boolean
        aborted:
          type: boolean
        finishedAt:
          type: [integer, "null"]
          description: Epoch milliseconds.
        checked:
          type: integer
        scanned:
          type: integer
        added:
          type: integer
        moved:
          type: integer
          description: Files matched to an existing item at a new path.
        revived:
          type: integer
          description: Previously missing items whose source reappeared.
        missing:
          type: integer
          description: Items tombstoned because their source was gone.
        changed:
          type: integer
      required:
        - jobId
        - rootPath
        - state
        - done
        - aborted
        - finishedAt
        - checked
        - scanned
        - added
        - moved
        - revived
        - missing
        - changed
    DeleteStatus:
      type: object
      description: Progress of one bulk delete.
      properties:
        jobId:
          type: string
        state:
          type: string
        done:
          type: boolean
        aborted:
          type: boolean
        total:
          type: integer
        deleted:
          type: integer
        failed:
          type: integer
      required:
        - jobId
        - state
        - done
        - aborted
        - total
        - deleted
        - failed
    QueueDepth:
      type: object
      description: Outstanding work in one queue.
      properties:
        waiting:
          type: integer
          description: Waiting plus prioritized.
        active:
          type: integer
        delayed:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
          description: waiting + active + delayed.
      required:
        - waiting
        - active
        - delayed
        - failed
        - pending
    QueueDepthsResponse:
      type: object
      description: Depths for every queue, plus the two independent pause switches.
      properties:
        queues:
          type: object
          description: Keyed by queue name. A value is null when that queue could not be read.
          additionalProperties:
            anyOf:
              - $ref: "#/components/schemas/QueueDepth"
              - type: "null"
        derivativesPaused:
          type: boolean
          description: Runtime pause, set by `stop-all` and cleared by `resume`.
        feederEnabled:
          type: boolean
          description: Deploy-time `DERIVATIVE_FEED_ENABLED`. `resume` cannot change this.
      required:
        - queues
        - derivativesPaused
        - feederEnabled
    JobControlResponse:
      type: object
      description: Which queues a stop action drained.
      properties:
        ok:
          type: boolean
        cleared:
          type: array
          items:
            type: string
      required:
        - ok
        - cleared
    DerivativeStageProgress:
      type: object
      description: Backlog and throughput for one derivative stage.
      properties:
        pending:
          type: integer
        ready:
          type: integer
        ratePerSec:
          type: [number, "null"]
          description: Completions per second over a trailing window. Null until two samples exist.
        etaSeconds:
          type: [number, "null"]
          description: pending ÷ ratePerSec. Null when the rate is null or nothing is pending.
      required:
        - pending
        - ready
        - ratePerSec
        - etaSeconds
    DerivativeProgress:
      type: object
      description: Derivative backlog for the progress strip.
      properties:
        thumb:
          $ref: "#/components/schemas/DerivativeStageProgress"
        text:
          allOf:
            - $ref: "#/components/schemas/DerivativeStageProgress"
          description: "`pending` is tier-1 extraction only; the tier-2 backlog is `needsOcr`."
        needsOcr:
          type: integer
          description: Items awaiting Tesseract — the number a user decides whether to pay for.
      required:
        - thumb
        - text
        - needsOcr
    MediaUpdateRequest:
      type: object
      description: Update request for media metadata. At least one field required.
      properties:
        title:
          type: string
          minLength: 1
        tags:
          $ref: "#/components/schemas/TagInput"
      anyOf:
        - required: [title]
        - required: [tags]
    MediaUpdate:
      type: object
      description: Updated media metadata.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        filename:
          type: string
        sizeBytes:
          type: [integer, "null"]
        mimeType:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - filename
        - mimeType
        - thumbState
        - textState
        - tags
    MediaUpdateResponse:
      type: object
      description: Media update response envelope.
      properties:
        media:
          $ref: "#/components/schemas/MediaUpdate"
      required:
        - media
    MediaDownloadResponse:
      type: object
      description: Presigned download URL response.
      properties:
        url:
          type: string
      required:
        - url
    MediaTextChunk:
      type: object
      description: Chunk of extracted text with pagination metadata.
      properties:
        text:
          type: string
        offset:
          type: integer
        limit:
          type: integer
        totalLength:
          type: integer
        hasMore:
          type: boolean
        textSource:
          anyOf:
            - $ref: "#/components/schemas/TextSource"
            - type: "null"
      required:
        - text
        - offset
        - limit
        - totalLength
        - hasMore
    TextExtractionRequest:
      type: object
      description: Options for re-running text extraction.
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 12
          description: ISO 639 language hint for Tesseract (e.g. `eng`, `fra`).
        rotation:
          type: string
          enum: ["0", "90", "180", "270"]
          description: Page rotation to apply before OCR.
        forceOcr:
          type: boolean
          description: Force OCR even if native text is available.
    ImageGps:
      type: object
      description: GPS coordinates extracted from image metadata.
      properties:
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: [number, "null"]
      required:
        - latitude
        - longitude
    ImageMetadata:
      type: object
      description: Image metadata extracted from EXIF.
      properties:
        make:
          type: [string, "null"]
        model:
          type: [string, "null"]
        lens:
          type: [string, "null"]
        iso:
          type: [number, "null"]
        exposureTime:
          type: [number, "null"]
        fNumber:
          type: [number, "null"]
        focalLengthMm:
          type: [number, "null"]
        orientation:
          type: [number, "null"]
        colorSpace:
          type: [string, "null"]
        editedBy:
          type: [string, "null"]
        capturedAt:
          type: [string, "null"]
        width:
          type: [number, "null"]
        height:
          type: [number, "null"]
        bitDepth:
          type: [number, "null"]
        hasAlpha:
          type: [boolean, "null"]
        gps:
          anyOf:
            - $ref: "#/components/schemas/ImageGps"
            - type: "null"
    PdfMetadata:
      type: object
      description: PDF document metadata.
      properties:
        title:
          type: [string, "null"]
        author:
          type: [string, "null"]
        subject:
          type: [string, "null"]
        producer:
          type: [string, "null"]
        creator:
          type: [string, "null"]
        pdfVersion:
          type: [string, "null"]
        pageCount:
          type: [number, "null"]
        encrypted:
          type: [boolean, "null"]
        createdAt:
          type: [string, "null"]
        modifiedAt:
          type: [string, "null"]
    OfficeMetadata:
      type: object
      description: Office document metadata.
      properties:
        application:
          type: [string, "null"]
        appVersion:
          type: [string, "null"]
        lastModifiedBy:
          type: [string, "null"]
        revision:
          type: [number, "null"]
        language:
          type: [string, "null"]
        hasComments:
          type: [boolean, "null"]
        hasTrackedChanges:
          type: [boolean, "null"]
    TextStats:
      type: object
      description: Computed statistics for extracted text.
      properties:
        totalChars:
          type: [number, "null"]
        totalWords:
          type: [number, "null"]
        pageCount:
          type: [number, "null"]
        pagesWithText:
          type: [number, "null"]
        avgCharsPerPage:
          type: [number, "null"]
        avgWordsPerPage:
          type: [number, "null"]
    MediaMetadata:
      type: object
      description: Derived metadata for a media item.
      properties:
        image:
          anyOf:
            - $ref: "#/components/schemas/ImageMetadata"
            - type: "null"
        pdf:
          anyOf:
            - $ref: "#/components/schemas/PdfMetadata"
            - type: "null"
        office:
          anyOf:
            - $ref: "#/components/schemas/OfficeMetadata"
            - type: "null"
        text:
          anyOf:
            - $ref: "#/components/schemas/TextStats"
            - type: "null"
    MediaPermissions:
      type: object
      description: Permission flags for the authenticated user on this media item.
      properties:
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        canDownload:
          type: boolean
        canOcr:
          type: boolean
      required:
        - canEdit
        - canDelete
        - canDownload
        - canOcr
    TextSegment:
      type: object
      description: One addressable span of extracted text.
      properties:
        segmentId:
          type: integer
        order:
          type: integer
        text:
          type: string
      required:
        - segmentId
        - order
        - text
    DocumentDetail:
      type: object
      description: Extracted text detail for a document.
      properties:
        rawText:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TextSegment"
        textSource:
          anyOf:
            - $ref: "#/components/schemas/TextSource"
            - type: "null"
        textTotalLength:
          type: integer
        textLanguage:
          type: [string, "null"]
        textLanguageStatus:
          anyOf:
            - $ref: "#/components/schemas/TextLanguageStatus"
            - type: "null"
      required:
        - rawText
        - textTotalLength
    MediaDetail:
      type: object
      description: Full media record with derived fields.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        title:
          type: [string, "null"]
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: [integer, "null"]
        storageKey:
          type: [string, "null"]
          description: Key of the Vault-managed original. Exactly one of `storageKey` and `sourcePath` is set.
        sourcePath:
          type: [string, "null"]
          description: Absolute path of an in-place indexed original. Vault never writes to or deletes it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        thumbError:
          type: [string, "null"]
        textState:
          $ref: "#/components/schemas/MediaWorkerState"
        textQueuedAt:
          type: [string, "null"]
          format: date-time
          description: When the row was handed to a text queue. Null while `PENDING` means it is still in the backlog.
        thumbnailKey:
          type: [string, "null"]
        hasText:
          type: boolean
        hasThumb:
          type: boolean
        textError:
          type: [string, "null"]
        textAttemptsMade:
          type: [integer, "null"]
        textAttemptsTotal:
          type: [integer, "null"]
        linkedBundleId:
          type: [string, "null"]
          description: Set when this item is an archive that was unpacked into a bundle.
        memberBundles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
        reminders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              note:
                type: [string, "null"]
              remindAt:
                type: string
                format: date-time
              dueAt:
                type: string
                format: date-time
            required:
              - id
              - title
              - remindAt
              - dueAt
      required:
        - id
        - userId
        - filename
        - mimeType
        - createdAt
        - updatedAt
        - tags
        - thumbState
        - textState
        - hasText
        - hasThumb
    MediaDetailResponse:
      type: object
      description: Media detail response envelope.
      properties:
        media:
          $ref: "#/components/schemas/MediaDetail"
        document:
          anyOf:
            - $ref: "#/components/schemas/DocumentDetail"
            - type: "null"
        metadata:
          anyOf:
            - $ref: "#/components/schemas/MediaMetadata"
            - type: "null"
        permissions:
          anyOf:
            - $ref: "#/components/schemas/MediaPermissions"
            - type: "null"
        autoTags:
          type: array
          description: Subset of `media.tags` applied by tag rules (origin `AUTO`).
          items:
            type: string
        localPath:
          type: [string, "null"]
          description: "`sourcePath` for in-place items, the resolved storage path for managed ones."
      required:
        - media
        - document
        - metadata
        - autoTags
        - localPath

    # --- Tags ---
    TagCount:
      type: object
      description: Tag name with usage count and optional color.
      properties:
        name:
          type: string
        count:
          type: integer
        color:
          type: [string, "null"]
          description: Hex color string (e.g. `#ff5733`) or null.
        origin:
          type: string
          description: "`AUTO` for tags applied by a tag rule, `USER` for tags the user typed."
          enum: [USER, AUTO]
      required:
        - name
        - count
    TagsResponse:
      type: object
      description: Tag list response with pagination metadata.
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
      required:
        - tags
        - total
        - offset
        - limit
    TagPatchRequest:
      type: object
      description: Fields to update on a tag (at least one required).
      properties:
        name:
          type: string
          minLength: 1
          description: New tag name (will be normalized).
        color:
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Hex color string or null to clear.
    TagPatchResponse:
      type: object
      description: Result of a tag update.
      properties:
        ok:
          type: boolean
        tag:
          type: string
          description: Original tag name.
        newName:
          type: string
          description: Normalized new name (only present on rename).
        affected:
          type: integer
          description: Number of media items updated (only present on rename).
      required:
        - ok
        - tag
    TagDeleteResponse:
      type: object
      description: Tag deletion response.
      properties:
        ok:
          type: boolean
        tag:
          type: string
      required:
        - ok
        - tag

    # --- Tag rules ---
    TagRuleSource:
      type: string
      description: Which deterministic fact about a file the rule reads.
      enum:
        - MIME
        - EXTENSION
        - FILENAME
        - PATH_SEGMENT
        - FILE_DATE
        - SIZE
    TagRuleMatcher:
      type: object
      description: Configuration for the rule's `source`. Unknown keys are rejected.
      oneOf:
        - title: MIME
          type: object
          additionalProperties: false
          properties:
            mimePrefixes:
              type: array
              maxItems: 20
              items:
                type: string
              description: Match MIME types starting with any of these. Absent means all.
        - title: EXTENSION
          type: object
          additionalProperties: false
          properties:
            extensions:
              type: array
              maxItems: 50
              items:
                type: string
                pattern: "^[a-z0-9]+$"
              description: Lowercase, no dot. Absent means any extension.
        - title: FILENAME
          type: object
          additionalProperties: false
          properties:
            pattern:
              type: string
              minLength: 1
              maxLength: 200
              description: Case-insensitive regex. The first capture group becomes `{value}`.
          required:
            - pattern
        - title: PATH_SEGMENT
          type: object
          additionalProperties: false
          properties:
            maxDepth:
              type: integer
              minimum: 1
              maximum: 10
              description: Directory levels beneath the index root to tag. Absent means every level.
        - title: FILE_DATE
          type: object
          additionalProperties: false
          properties:
            granularity:
              type: string
              enum: [year, month]
          required:
            - granularity
        - title: SIZE
          type: object
          additionalProperties: false
          description: At least one bound is required.
          properties:
            minBytes:
              type: number
              minimum: 0
            maxBytes:
              type: number
              exclusiveMinimum: 0
    TagRule:
      type: object
      description: A rule that applies a tag derived from one file fact.
      properties:
        id:
          type: string
        name:
          type: string
        source:
          $ref: "#/components/schemas/TagRuleSource"
        matcher:
          $ref: "#/components/schemas/TagRuleMatcher"
        tagTemplate:
          type: string
          description: Tag to apply, with `{value}` replaced by the rule's computed value.
          example: "type:{value}"
        priority:
          type: integer
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - source
        - matcher
        - tagTemplate
        - priority
        - enabled
        - createdAt
        - updatedAt
    TagRuleCreateRequest:
      type: object
      description: New tag rule.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        source:
          $ref: "#/components/schemas/TagRuleSource"
        matcher:
          $ref: "#/components/schemas/TagRuleMatcher"
        tagTemplate:
          type: string
          minLength: 1
          maxLength: 64
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
          default: 0
        enabled:
          type: boolean
          default: true
      required:
        - name
        - source
        - tagTemplate
    TagRulePatchRequest:
      description: Fields to update. At least one is required.
      allOf:
        - $ref: "#/components/schemas/TagRuleCreateRequest"
      required: []
    TagRuleResponse:
      type: object
      description: Single tag rule envelope.
      properties:
        rule:
          $ref: "#/components/schemas/TagRule"
      required:
        - rule
    OrganizePreviewItem:
      type: object
      description: One previewed change from a dry run.
      properties:
        mediaId:
          type: string
          format: uuid
        title:
          type: string
        addTags:
          type: array
          items:
            type: string
      required:
        - mediaId
        - title
        - addTags
    OrganizeStatus:
      type: object
      description: Progress of a retroactive tag-rule run.
      properties:
        jobId:
          type: string
        state:
          type: string
        done:
          type: boolean
        dryRun:
          type: boolean
        total:
          type: integer
          description: Media rows considered.
        processed:
          type: integer
        updated:
          type: integer
          description: Rows that received (or would receive) at least one new tag.
        tagsAdded:
          type: integer
          description: Total tag applications added (or previewed).
        tagCounts:
          type: object
          description: Per-tag application counts, capped server-side.
          additionalProperties:
            type: integer
        sample:
          type: array
          description: Dry run only — a small sample of per-item changes.
          items:
            $ref: "#/components/schemas/OrganizePreviewItem"
      required:
        - jobId
        - state
        - done
        - dryRun
        - total
        - processed
        - updated
        - tagsAdded
        - tagCounts

    # --- Sidecars ---
    SidecarExportResult:
      type: object
      description: Counts from one export pass.
      properties:
        entries:
          type: integer
        bytes:
          type: integer
        exportedAt:
          type: string
          format: date-time
      required:
        - entries
        - bytes
        - exportedAt
    SidecarRestoreResult:
      type: object
      description: "`matched` is snapshot entries that found a row; `updated` is rows changed, which is 0 on a re-run."
      properties:
        entries:
          type: integer
        matched:
          type: integer
        updated:
          type: integer
        tagsRestored:
          type: integer
        bundlesRestored:
          type: integer
        remindersRestored:
          type: integer
        tagVocabularyRestored:
          type: integer
          description: Tag rows whose colour and origin came back from the snapshot.
      required:
        - entries
        - matched
        - updated
        - tagsRestored
        - bundlesRestored
        - remindersRestored
        - tagVocabularyRestored
    SidecarRestoreState:
      description: "`interrupted` is derived on read from a run recorded as running with no live process behind it."
      oneOf:
        - title: running
          type: object
          properties:
            state:
              type: string
              enum: [running]
            startedAt:
              type: string
              format: date-time
            processed:
              type: integer
          required: [state, startedAt, processed]
        - title: done
          type: object
          properties:
            state:
              type: string
              enum: [done]
            finishedAt:
              type: string
              format: date-time
            result:
              $ref: "#/components/schemas/SidecarRestoreResult"
          required: [state, finishedAt, result]
        - title: failed
          type: object
          properties:
            state:
              type: string
              enum: [failed]
            finishedAt:
              type: string
              format: date-time
            message:
              type: string
          required: [state, finishedAt, message]
        - title: interrupted
          type: object
          properties:
            state:
              type: string
              enum: [interrupted]
            startedAt:
              type: string
              format: date-time
            processed:
              type: integer
          required: [state, startedAt, processed]
    SidecarStatus:
      type: object
      description: What exists on disk, and any restore in flight.
      properties:
        enabled:
          type: boolean
          description: False when the server runs with `SIDECAR_EXPORT_ENABLED=false`, whatever `mode` says.
        mode:
          type: string
          enum: [off, snapshot]
        snapshot:
          anyOf:
            - type: object
              properties:
                exportedAt:
                  type: string
                  format: date-time
                entries:
                  type: integer
                sizeBytes:
                  type: integer
              required: [exportedAt, entries, sizeBytes]
            - type: "null"
        restore:
          anyOf:
            - $ref: "#/components/schemas/SidecarRestoreState"
            - type: "null"
      required:
        - enabled
        - mode
        - snapshot
        - restore

    # --- Bundles ---
    BundleSummary:
      type: object
      description: Bundle summary returned in list responses.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        starred:
          type: boolean
        itemCount:
          type: integer
        coverMediaId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - starred
        - itemCount
        - createdAt
        - updatedAt
    BundleItem:
      type: object
      description: A media item within a bundle.
      properties:
        mediaId:
          type: string
          format: uuid
        order:
          type: integer
        addedAt:
          type: string
          format: date-time
        title:
          type: [string, "null"]
        mimeType:
          type: string
        thumbState:
          $ref: "#/components/schemas/MediaWorkerState"
        thumbnailKey:
          type: [string, "null"]
      required:
        - mediaId
        - order
        - addedAt
        - mimeType
        - thumbState
    BundleDetail:
      description: Bundle summary with its ordered item list.
      allOf:
        - $ref: "#/components/schemas/BundleSummary"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BundleItem"
          required:
            - items
    BundleListResponse:
      type: object
      description: Bundle list response envelope.
      properties:
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/BundleSummary"
      required:
        - bundles
    BundleSummaryResponse:
      type: object
      description: Single bundle summary response envelope.
      properties:
        bundle:
          $ref: "#/components/schemas/BundleSummary"
      required:
        - bundle
    BundleDetailResponse:
      type: object
      description: Bundle detail response envelope.
      properties:
        bundle:
          $ref: "#/components/schemas/BundleDetail"
      required:
        - bundle
    BundleCreateRequest:
      type: object
      description: Request to create a new bundle.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
      required:
        - name
    BundlePatchRequest:
      type: object
      description: Update bundle fields (at least one field required).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 1000
        starred:
          type: boolean
        coverMediaId:
          type: [string, "null"]
          format: uuid
    BundleAddItemsRequest:
      type: object
      description: Add media items to a bundle (1–100 IDs).
      properties:
        mediaIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
      required:
        - mediaIds
    BundleOrderRequest:
      type: object
      description: Reorder items in a bundle by providing the full ordered list of media IDs.
      properties:
        orderedIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
      required:
        - orderedIds
    BundleStarResponse:
      type: object
      description: Result of toggling the starred state.
      properties:
        ok:
          type: boolean
        starred:
          type: boolean
      required:
        - ok
        - starred

    # --- Reminders ---
    ReminderStatus:
      type: string
      description: Lifecycle state of a reminder.
      enum:
        - ACTIVE
        - COMPLETED
        - CANCELED
    ReminderBucket:
      type: string
      description: Urgency bucket derived from due date relative to now.
      enum:
        - overdue
        - today
        - soon
        - later
    ReminderMediaRef:
      type: object
      description: Minimal media reference attached to a reminder.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
      required:
        - id
    Reminder:
      type: object
      description: Full reminder record.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        title:
          type: string
        note:
          type: [string, "null"]
        mediaId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/ReminderStatus"
        timezone:
          type: string
          description: IANA timezone identifier.
        dueAt:
          type: string
          format: date-time
        nextDueAt:
          type: [string, "null"]
          format: date-time
          description: Next occurrence due date for recurring reminders.
        remindOffsetDays:
          type: [integer, "null"]
          description: Days before `dueAt` to surface the reminder.
        remindAt:
          type: string
          format: date-time
          description: Computed time when the reminder becomes visible (`dueAt - remindOffsetDays`).
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        rrule:
          type: [string, "null"]
          description: iCal RRULE string for recurring reminders.
        lastCompletedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - status
        - timezone
        - dueAt
        - remindAt
        - createdAt
        - updatedAt
    ReminderSummaryItem:
      type: object
      description: Reminder list item with derived urgency fields.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        note:
          type: [string, "null"]
        media:
          anyOf:
            - $ref: "#/components/schemas/ReminderMediaRef"
            - type: "null"
        effectiveDueAt:
          type: string
          format: date-time
          description: The active due date (nextDueAt for recurring, dueAt otherwise).
        remindAt:
          type: string
          format: date-time
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        bucket:
          $ref: "#/components/schemas/ReminderBucket"
        isOverdue:
          type: boolean
        remindOffsetDays:
          type: [integer, "null"]
      required:
        - id
        - title
        - effectiveDueAt
        - remindAt
        - bucket
        - isOverdue
    ReminderListResponse:
      type: object
      description: Reminder list response envelope.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReminderSummaryItem"
      required:
        - items
    ReminderResponse:
      type: object
      description: Single reminder response envelope.
      properties:
        reminder:
          $ref: "#/components/schemas/Reminder"
      required:
        - reminder
    ReminderSummaryStats:
      type: object
      description: Aggregate reminder counts by urgency bucket.
      properties:
        visibleNow:
          type: integer
          description: Total reminders that are currently visible (past remindAt).
        overdue:
          type: integer
        dueToday:
          type: integer
        dueSoon:
          type: integer
        totalActive:
          type: integer
        soonWindowDays:
          type: integer
          description: Number of days used to define the "soon" window.
      required:
        - visibleNow
        - overdue
        - dueToday
        - dueSoon
        - totalActive
        - soonWindowDays
    CreateReminderRequest:
      type: object
      description: Request to create a reminder.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        note:
          type: [string, "null"]
          maxLength: 5000
        mediaId:
          type: [string, "null"]
          format: uuid
          description: Optional media item to link to this reminder.
        dueAt:
          type: string
          format: date-time
          description: Due date. Must be in the future.
        remindOffsetDays:
          type: [integer, "null"]
          minimum: 0
          description: Days before `dueAt` to surface the reminder. Defaults to 0 (due date itself).
        rrule:
          type: [string, "null"]
          maxLength: 1000
          description: iCal RRULE string for recurring reminders (e.g. `FREQ=MONTHLY`).
      required:
        - title
        - dueAt
    PatchReminderRequest:
      type: object
      description: Update reminder fields (at least one field required).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        note:
          type: [string, "null"]
          maxLength: 5000
        mediaId:
          type: [string, "null"]
          format: uuid
        dueAt:
          type: string
          format: date-time
        remindOffsetDays:
          type: [integer, "null"]
          minimum: 0
        rrule:
          type: [string, "null"]
          maxLength: 1000
    SnoozeReminderRequest:
      type: object
      description: Snooze a reminder until a future datetime.
      properties:
        until:
          type: string
          format: date-time
          description: Must be in the future.
      required:
        - until

    # --- Media bulk ops ---
    BulkDeleteRequest:
      type: object
      description: Omitted or empty, the query filters decide the set instead.
      properties:
        ids:
          type: array
          items:
            type: string
      required:
        - ids
    BulkDownloadRequest:
      type: object
      description: List of media IDs to include in the zip (1–50).
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
      required:
        - ids

    # --- Preferences ---
    Preferences:
      type: object
      description: Stored in `User.preferences` and mirrored into `localStorage`; the server's copy wins at startup.
      properties:
        libraryViewMode:
          type: string
          enum: [grid, list]
        libraryGridCols:
          type: integer
          enum: [4, 5, 6, 7, 8]
        libraryIsCompactList:
          type: boolean
        autoTagOnIngest:
          type: boolean
          description: Run tag rules at every ingest site (send, in-place index, archive unpack). Retroactive runs ignore this.
        extractMetadata:
          type: boolean
        detectDuplicates:
          type: boolean
          description: Controls duplicate *tagging* only. Hash-based derivative reuse happens regardless.
        lowMemoryMode:
          type: boolean
        autoUnpackArchives:
          type: boolean
        hideUnpackedItems:
          type: boolean
        ignoreHiddenFiles:
          type: boolean
        soonWindowDays:
          type: integer
          minimum: 2
          maximum: 14
        themePreference:
          type: string
          enum: [system, light, dark]
        yellowHighlight:
          type: boolean
        lightTheme:
          type: string
          enum: [default, latte, sandstone, mist, lavender, dream, cotton-candy, mint, garden]
        darkTheme:
          type: string
          enum: [new-moon, matrix, charcoal, solarized]
        exploreBucketColors:
          type: object
          description: Per-bucket colour overrides for the explore view.
          additionalProperties:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
        indexAllowedRoots:
          type: array
          description: Absolute directories Vault may index in place; empty disables the feature. Set via `PATCH /api/server/index-config`.
          items:
            type: string
        indexBlacklistExtensions:
          type: array
          description: Extensions (lowercase, no dot) skipped during in-place indexing.
          items:
            type: string
        indexExcludeFolders:
          type: array
          description: Absolute folders excluded even when they sit under an allowed root — e.g. `@eaDir`, `.immich`.
          items:
            type: string
        indexSkipNonContent:
          type: boolean
          description: Skip build and dependency directories and non-content file types.
        ingestFolderPath:
          type: [string, "null"]
          description: Where a sent file is written; must sit inside an allowed index root. Null disables sending.
        moveDetectionWindowSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: How long after a file disappears a matching new file still counts as that item moved.
        missingFileGraceDays:
          type: integer
          minimum: 1
          maximum: 365
          description: How long a missing item is kept, flagged and intact, before deletion.
        ocrMode:
          type: string
          description: |
            How scans — files with no text layer — are handled.
            * `onDemand` — extract when the user opens the document or asks.
            * `background` — a sweeper works the backlog continuously.
            * `off` — never; the backlog stays visible and can be run manually.
          enum: [onDemand, background, off]
        ocrTimeoutCapMinutes:
          type: integer
          minimum: 1
          maximum: 60
          description: Ceiling on one tier-2 OCR job's wall time.
        sidecarMode:
          type: string
          description: Whether Vault snapshots item metadata to managed storage. Never writes beside a source file.
          enum: [off, snapshot]
        sidecarIntervalMinutes:
          type: integer
          description: How often this user's snapshot is taken.
          enum: [5, 15, 60, 360, 1440]
    PreferencesResponse:
      type: object
      description: Preferences response envelope.
      properties:
        preferences:
          $ref: "#/components/schemas/Preferences"
      required:
        - preferences
    PreferencesPatchRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; unknown keys are rejected. The indexing keys
        (`indexAllowedRoots`, `indexBlacklistExtensions`, `indexExcludeFolders`,
        `indexSkipNonContent`, `ingestFolderPath`) are settable only through
        `PATCH /api/server/index-config`.
      properties:
        libraryViewMode:
          type: string
          enum: [grid, list]
        libraryGridCols:
          type: integer
          enum: [4, 5, 6, 7, 8]
        libraryIsCompactList:
          type: boolean
        autoTagOnIngest:
          type: boolean
        autoTagOnUpload:
          type: boolean
          deprecated: true
          description: Former name of `autoTagOnIngest`, still accepted and rewritten to it on read.
        extractMetadata:
          type: boolean
        detectDuplicates:
          type: boolean
        lowMemoryMode:
          type: boolean
        autoUnpackArchives:
          type: boolean
        hideUnpackedItems:
          type: boolean
        ignoreHiddenFiles:
          type: boolean
        soonWindowDays:
          type: integer
          minimum: 2
          maximum: 14
        themePreference:
          type: string
          enum: [system, light, dark]
        yellowHighlight:
          type: boolean
        lightTheme:
          type: string
          enum: [default, latte, sandstone, mist, lavender, dream, cotton-candy, mint, garden]
        darkTheme:
          type: string
          enum: [new-moon, matrix, charcoal, solarized]
        exploreBucketColors:
          type: object
          additionalProperties:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
        moveDetectionWindowSeconds:
          type: integer
          minimum: 30
          maximum: 3600
        missingFileGraceDays:
          type: integer
          minimum: 1
          maximum: 365
        ocrMode:
          type: string
          enum: [onDemand, background, off]
        ocrTimeoutCapMinutes:
          type: integer
          minimum: 1
          maximum: 60
        sidecarMode:
          type: string
          enum: [off, snapshot]
        sidecarIntervalMinutes:
          type: integer
          enum: [5, 15, 60, 360, 1440]

    # --- Server ---
    ServerStatusResponse:
      type: object
      description: Server runtime status.
      properties:
        env:
          type: string
          description: NODE_ENV value.
        apiPort:
          type: integer
        corsOrigin:
          type: string
        uptimeSeconds:
          type: number
        memoryMB:
          type: integer
          description: RSS memory usage in megabytes.
        storageDriver:
          type: string
          enum: [fs]
        storagePath:
          type: string
          description: Value of `STORAGE_FS_PATH`.
        localExplorer:
          type: boolean
          description: Whether the server can open a native file manager on the host.
      required:
        - env
        - apiPort
        - corsOrigin
        - uptimeSeconds
        - memoryMB
        - storageDriver
        - storagePath
        - localExplorer
    ServerStorageResponse:
      type: object
      description: Storage usage statistics.
      properties:
        sizeBytes:
          type: integer
          description: Total size of managed objects in bytes.
        objectCount:
          type: integer
          description: Number of managed objects.
        dbSizeBytes:
          type: integer
          description: Postgres database size in bytes.
      required:
        - sizeBytes
        - objectCount
        - dbSizeBytes
    WorkerQueueCounts:
      type: object
      description: Job counts for a single worker queue.
      properties:
        waiting:
          type: integer
        active:
          type: integer
        delayed:
          type: integer
        failed:
          type: integer
      required:
        - waiting
        - active
        - delayed
        - failed
    WorkerQueueStatus:
      type: object
      description: Status of a single worker queue.
      properties:
        active:
          type: boolean
          description: Whether at least one worker process is connected.
        count:
          type: integer
          description: Number of connected worker processes.
        counts:
          $ref: "#/components/schemas/WorkerQueueCounts"
      required:
        - active
        - count
        - counts
    ServerWorkersResponse:
      type: object
      description: Status of the derivative worker queues.
      properties:
        text:
          allOf:
            - $ref: "#/components/schemas/WorkerQueueStatus"
          description: Tier 1 — native extraction, milliseconds per job, high concurrency.
        ocr:
          allOf:
            - $ref: "#/components/schemas/WorkerQueueStatus"
          description: Tier 2 — Tesseract, roughly a core per slot, concurrency near the core count.
        thumb:
          $ref: "#/components/schemas/WorkerQueueStatus"
      required:
        - text
        - ocr
        - thumb

    IndexConfigResponse:
      type: object
      description: Current in-place indexing configuration.
      properties:
        roots:
          type: array
          items:
            type: string
        blacklist:
          type: array
          items:
            type: string
        excludeFolders:
          type: array
          items:
            type: string
        skipNonContent:
          type: boolean
        ingestFolderPath:
          type: [string, "null"]
        skipInfo:
          type: object
          description: What the built-in `skipNonContent` filter actually matches.
          properties:
            buildDirNames:
              type: array
              items:
                type: string
            buildDirSuffixes:
              type: array
              items:
                type: string
            contentExtensions:
              type: array
              items:
                type: string
          required:
            - buildDirNames
            - buildDirSuffixes
            - contentExtensions
      required:
        - roots
        - blacklist
        - excludeFolders
        - skipNonContent
        - ingestFolderPath
        - skipInfo
    IndexConfigPatchRequest:
      type: object
      description: "`roots` is required; omitting any other field keeps its stored value."
      properties:
        roots:
          type: array
          description: Absolute paths. Canonicalized and deduplicated server-side.
          items:
            type: string
        blacklist:
          type: array
          description: Extensions to skip. Normalized to lowercase without a dot.
          items:
            type: string
        excludeFolders:
          type: array
          items:
            type: string
        skipNonContent:
          type: boolean
        ingestFolderPath:
          type: [string, "null"]
          description: Must sit inside an allowed root. Null or empty string clears it.
      required:
        - roots
    IndexConfigPatchResponse:
      type: object
      description: Echoes back only the fields that were changed.
      properties:
        ok:
          type: boolean
        roots:
          type: array
          items:
            type: string
        blacklist:
          type: array
          items:
            type: string
        excludeFolders:
          type: array
          items:
            type: string
        skipNonContent:
          type: boolean
        ingestFolderPath:
          type: [string, "null"]
        ingestFolderCleared:
          type: boolean
          description: Present when dropping a root left the ingest folder outside the allow-list and it was cleared.
      required:
        - ok
        - roots
    FsListResponse:
      type: object
      description: One level of the server's filesystem.
      properties:
        path:
          type: string
          description: The directory actually listed, which may differ from the one requested.
        parent:
          type: [string, "null"]
          description: Null at a filesystem root.
        dirs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
            required:
              - name
              - path
        roots:
          type: array
          description: Filesystem roots — drive letters on Windows, `/` elsewhere.
          items:
            type: object
            properties:
              path:
                type: string
              freeBytes:
                type: [integer, "null"]
              totalBytes:
                type: [integer, "null"]
            required:
              - path
              - freeBytes
              - totalBytes
        redirected:
          type: boolean
          description: True when the requested path was unreadable and an ancestor was listed instead.
      required:
        - path
        - parent
        - dirs
        - roots
        - redirected

    # --- Init ---
    InitResponse:
      type: object
      description: Bootstrap payload returned on app load.
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        preferences:
          $ref: "#/components/schemas/Preferences"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/BundleSummary"
        remindersSummary:
          $ref: "#/components/schemas/ReminderSummaryStats"
        overviewReminders:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReminderSummaryItem"
          required:
            - items
      required:
        - user
        - preferences
        - tags
        - bundles
        - remindersSummary
        - overviewReminders

